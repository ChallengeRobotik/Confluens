<title>Administration · Régulation Bus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300266b'/%3E%3Ctext x='32' y='46' font-family='Arial' font-weight='700' font-size='40' text-anchor='middle' fill='%23ff8a00'%3EA%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:Parisine;src:url(Parisine-Regular.otf) format("opentype");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-Bold.otf) format("opentype");font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-Italic.otf) format("opentype");font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-BoldItalic.otf) format("opentype");font-weight:700;font-style:italic;font-display:swap}
/* Même identité que le site de régulation : marine / bleu RATP / orange LED */
:root{
  --page:#0e1628;--bar:#162343;--ink:#425ba2;--blue:#2458c4;--blue-h:#2f66d8;--blue-d:#173c8c;
  --surface:#e6ebf5;--surface-2:#f4f6fb;--muted:#425ba2;--line:rgba(18,40,90,.14);
  --on-dark:#fff;--on-dark-2:rgba(255,255,255,.72);--glass:rgba(255,255,255,.12);
  --led:#ff8a00;--ok:#0a8a4a;--late:#d6281c;--lc:#2458c4;--r:16px
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--page);min-height:100%}
body{min-height:100vh;background:var(--page);color:var(--on-dark);font-family:Parisine,"Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--led);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
main{max-width:1100px;margin:auto;padding:clamp(16px,4vw,40px);padding-bottom:calc(60px + env(safe-area-inset-bottom))}
h2{font-size:clamp(28px,5.6vw,48px);line-height:1.05;letter-spacing:-.02em;margin:.1em 0 .25em;font-weight:700}
.hint{color:var(--on-dark-2);margin:6px 0 0;font-size:16px;line-height:1.4;max-width:620px}
.sec{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--on-dark-2);margin:28px 0 12px}
.hero{margin:6px 0 20px}
.v{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

#hdr{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:var(--bar);border-bottom:1px solid rgba(255,255,255,.08)}
#hdr .hi{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:10px clamp(16px,4vw,40px)}
.gt{margin-right:auto;min-width:0}
#hg{display:block;font-size:clamp(22px,5vw,32px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
#hd{display:block;font-size:13px;color:var(--on-dark-2);margin-top:2px}
#hc{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(18px,3.6vw,24px);color:var(--led);background:#000;padding:6px 12px;border-radius:9px}
#nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass);flex-wrap:wrap}
#nav button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 13px;background:transparent;color:#fff;cursor:pointer;opacity:.78;transition:.2s}
#nav button:hover{opacity:1}
#nav button.on{background:var(--surface);color:var(--ink);opacity:1}

.card{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:clamp(18px,3vw,26px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lab{color:var(--muted);font-style:italic;font-size:15px}
.badge{display:inline-block;background:rgba(18,40,90,.1);color:var(--ink);padding:3px 11px;border-radius:99px;font-size:13.5px;font-weight:700;white-space:nowrap}
.badge.ok{background:rgba(10,138,74,.14);color:var(--ok)}
.badge.ko{background:rgba(214,40,28,.14);color:var(--late)}
.badge.warn{background:#f3ead3;color:#5f4a1c}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--blue);color:#fff;transition:transform .15s,background .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--blue-h)}.btn:active{transform:scale(.97)}
.btn.sm{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.g{background:var(--glass);color:#fff}.btn.g:hover{background:rgba(255,255,255,.2)}
.card .btn.g,.dlg .btn.g{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.card .btn.g:hover,.dlg .btn.g:hover{background:#eef2fb}
.btn.red{background:var(--late)}.btn.red:hover{background:#e5372b}
.srch,.fld{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #c5cde0;color:var(--muted)}
.srch:focus-within,.fld:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.srch input,.fld input,.fld select,.fld textarea{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:13px 0}
.fld textarea{resize:vertical;min-height:84px;line-height:1.4}
.fld select{cursor:pointer}
.stack{display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;flex-wrap:wrap}.frow>*{flex:1;min-width:140px}
.msg-err{min-height:1.2em;color:var(--late);font-weight:700;font-size:14px}

/* lignes de liste (même gabarit que les départs) */
.bd{display:flex;flex-direction:column;gap:12px}
.urow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
.urow.sanc{background:#e9d3d2}
.av{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:22px;background:var(--lc);color:var(--li,#fff)}
.ub{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}
.ub b{font-size:clamp(18px,3.4vw,24px);line-height:1.1;word-break:break-word}
.ub small{color:var(--muted);font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.led{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.14em;color:var(--led);background:#000;padding:5px 10px;border-radius:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--glass);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;min-width:120px}
.stat b{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}.stat small{font-size:12.5px;color:var(--on-dark-2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tools .srch{flex:1;min-width:220px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass)}
.seg button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;background:transparent;color:#fff;cursor:pointer;opacity:.78}
.seg button.on{background:var(--surface);color:var(--ink);opacity:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:5px 6px 5px 13px;font-weight:700}
.chip button{border:0;background:rgba(18,40,90,.1);color:var(--ink);width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:700}
.chip button:hover{background:rgba(214,40,28,.2);color:var(--late)}
.empty{color:var(--on-dark-2);padding:18px 4px;font-style:italic}

/* lignes */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:14px}
.lhd{display:flex;align-items:center;gap:14px}
.lb{flex:none;min-width:76px;height:54px;padding:0 12px;border-radius:12px;display:grid;place-items:center;font-size:30px;font-weight:700;background:var(--lc);color:var(--li)}
.lhd .ub{min-width:0}
.sw{position:relative;flex:none;width:58px;height:32px;border-radius:99px;border:0;background:#aab3cc;cursor:pointer;transition:background .25s}
.sw:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]:after{transform:translateX(26px)}
.lcard.offl .lb{opacity:.45;filter:grayscale(.6)}
.dirbox{border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.dirbox .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
.dirbox .frow>*{min-width:120px}
.dirbox .fld{padding:0 10px}.dirbox .fld select{padding:10px 0;font-size:14.5px}
.sub{font-size:12.5px;color:var(--muted);font-style:italic}

/* messages / discussions */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-weight:700}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.rooms-pick{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;padding:2px}
.hist{display:flex;flex-direction:column;gap:10px}
.hitem{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--led);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.hitem .tx{line-height:1.35;word-break:break-word;min-width:0}
.hitem small{display:block;color:var(--muted);margin-top:4px;font-size:12.5px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cmsg{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface-2);word-break:break-word}
.cmsg small{color:var(--muted);margin-left:6px;font-style:italic}
.cmsg .x{flex:none}
.xbtn{border:0;background:rgba(214,40,28,.12);color:var(--late);border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700;font-size:16px}
.xbtn:hover{background:rgba(214,40,28,.25)}

/* fenêtres */
.ovl{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:rgba(14,22,40,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s ease-out both;overflow:auto}
.dlg{width:min(460px,100%);display:flex;flex-direction:column;gap:14px;animation:in .4s cubic-bezier(.2,.8,.2,1) both}
.dlg h2{color:var(--ink);font-size:clamp(24px,5vw,30px);margin:0}
.dlg p{color:var(--muted);line-height:1.4}
.dlg .frow{justify-content:flex-end}.dlg .frow>*{flex:0 0 auto}
.dlg.wide{width:min(860px,100%)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:700;max-width:min(92vw,440px);background:#000;color:var(--led);padding:12px 18px;border-radius:12px;font-weight:700;text-align:center;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}
#gate .dlg{--x:0}
@media(max-width:760px){.two{grid-template-columns:1fr}.acts{justify-content:flex-start}}
</style></head>

function ask({title,text,fields=[],ok="Valider",danger=false,wide=false}){
  return new Promise(res=>{
    const o=document.createElement("div");o.className="ovl";
    o.innerHTML=`<form class="card dlg${wide?" wide":""}" novalidate><h2>${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:""}
      ${fields.map(f=>`<label class="fld">${f.type==="select"?`<select id="f-${f.id}" aria-label="${esc(f.label)}">${f.options.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(f.value)?" selected":""}>${esc(l)}</option>`).join("")}</select>`
        :`<input id="f-${f.id}" type="text" maxlength="${f.max||80}" placeholder="${esc(f.label)}" value="${esc(f.value||"")}" aria-label="${esc(f.label)}" autocomplete="off">`}</label>`).join("")}
      <p class="msg-err" role="alert"></p>
      <div class="frow"><button type="button" class="btn g" data-x>Annuler</button><button type="submit" class="btn${danger?" red":""}">${esc(ok)}</button></div></form>`;
    document.body.appendChild(o);
    const f=o.querySelector("form"),close=v=>{o.remove();res(v)};
    const first=o.querySelector("input,select");if(first)setTimeout(()=>first.focus(),50);
    o.querySelector("[data-x]").onclick=()=>close(null);
    o.addEventListener("mousedown",e=>{if(e.target===o)close(null)});
    o.addEventListener("keydown",e=>{if(e.key==="Escape")close(null)});
    f.onsubmit=e=>{e.preventDefault();const v={};fields.forEach(x=>v[x.id]=o.querySelector("#f-"+x.id).value.trim());
      const er=ask.validate?ask.validate(v):"";if(er){o.querySelector(".msg-err").textContent=er;return}close(v)};
  });
}

async function sha(t){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
let AUTH=null;
async function gate(){
  const g=$("#gate"),f=$("#gf"),err=$("#ge"),b=$("#gb");
  try{AUTH=await GET("admin/auth")}catch(_){$("#gp").textContent="Base de données injoignable. Recharge la page.";return}
  try{if(AUTH&&sessionStorage.getItem("adm_ok")===AUTH.hash){g.remove();start();return}}catch(_){}
  const setup=!AUTH;
  $("#gt").textContent=setup?"Créer l’accès":"Administration";
  $("#gp").textContent=setup?"Choisis le mot de passe administrateur (8 caractères minimum).":"Entre le mot de passe administrateur.";
  $("#gl2").hidden=!setup;b.disabled=false;b.textContent=setup?"Créer et entrer":"Entrer";
  setTimeout(()=>$("#gp1").focus(),50);
  f.onsubmit=async e=>{
    e.preventDefault();err.textContent="";b.disabled=true;
    const p=$("#gp1").value;
    try{
      if(setup){
        if(p.length<8){err.textContent="8 caractères minimum.";b.disabled=false;return}
        if(p!==$("#gp2").value){err.textContent="Les deux mots de passe diffèrent.";b.disabled=false;return}
        const salt=Math.random().toString(36).slice(2,12),hash=await sha(salt+p);
        await api("PUT","admin/auth",{salt,hash});AUTH={salt,hash};
      }else if(await sha(AUTH.salt+p)!==AUTH.hash){err.textContent="Mot de passe incorrect.";b.disabled=false;f.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:240});return}
      try{sessionStorage.setItem("adm_ok",AUTH.hash)}catch(_){}
      g.remove();start();
    }catch(_){err.textContent="Connexion impossible.";b.disabled=false}
  };
}
$("#out").onclick=()=>{try{sessionStorage.removeItem("adm_ok")}catch(_){}location.reload()};

let ACC={},MU={},MI={},BAD=[],accQ="",accF="all";
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return["#9a0e54","#003da4","#008080","#6e6e00","#00643c","#c21727","#425ba2","#dbac29"][h%8]};
async function accLoad(){
  const[a,u,i,b]=await Promise.all([GET("accounts"),GET("mod/users"),GET("mod/ips"),GET("config/bad")]);
  ACC=a||{};MU=u||{};MI=i||{};BAD=Object.entries(b||{}).map(([k,v])=>({k,v}));

function statusOf(id,a){
  const u=MU[id];if(live(u))return{cls:"ko",t:(u.type==="kick"?"Exclu ":"Banni ")+untilTxt(u),sanc:true};
  if(a.ip&&live(MI[ipKey(a.ip)]))return{cls:"ko",t:"IP bannie "+untilTxt(MI[ipKey(a.ip)]),sanc:true};
  if(a.seen&&Date.now()-a.seen<150000)return{cls:"ok",t:"En ligne"};
  return{cls:"",t:"Hors ligne"};
}
function accRender(){
  const ids=Object.keys(ACC),q=normS(accQ);
  const rows=ids.map(id=>({id,a:ACC[id]||{},s:statusOf(id,ACC[id]||{})}))
    .filter(r=>(!q||normS((r.a.pseudo||"")+" "+r.id+" "+(r.a.ip||"")).includes(q))&&(accF==="all"||(accF==="on"&&r.s.cls==="ok")||(accF==="sanc"&&r.s.sanc)))
    .sort((x,y)=>(y.a.seen||0)-(x.a.seen||0));
  const online=ids.filter(i=>ACC[i]&&ACC[i].seen&&Date.now()-ACC[i].seen<150000).length;
  const sanc=ids.filter(i=>statusOf(i,ACC[i]||{}).sanc).length;
  $("#st").innerHTML=`<div class="stat"><b>${ids.length}</b><small>comptes</small></div><div class="stat"><b>${online}</b><small>en ligne</small></div><div class="stat"><b>${sanc}</b><small>sanctionnés</small></div>`;
  $("#ul").innerHTML=rows.length?rows.map((r,j)=>{
    const c=hue(r.a.pseudo||"?"),sn=!!r.s.sanc;
    return`<div class="urow${sn?" sanc":""}" style="--i:${Math.min(j,12)}" data-u="${esc(r.id)}"><span class="av" style="--lc:${c};--li:${ink(c)}">${esc((r.a.pseudo||"?")[0].toUpperCase())}</span>
      <div class="ub"><b>${esc(r.a.pseudo||"?")}</b><small>${esc(r.id)} · ${esc(r.a.ip||"IP inconnue")} · inscrit le ${r.a.created?fdt(r.a.created):"?"} · vu ${ago(r.a.seen)}</small></div>

let CF={lines:{},svc:{}};
async function cfLoad(){const c=await GET("config")||{};CF={lines:c.lines||{},svc:c.svc||{}}}
const svcOv=(n,k)=>{const x=CF.svc[n];return x?x[k]:null};
const svcDef=(n,k)=>{const d=LINES[n].svc&&LINES[n].svc[k];return d?[d[0],d[1]]:[0,LINES[n].s[k].length-1]};
const lineIsOn=n=>!(CF.lines[n]&&CF.lines[n].on===false);
function dirBox(n,k){
  const st=LINES[n].s[k],last=st.length-1,ov=svcOv(n,k);
  let [a,e]=svcDef(n,k);
  if(ov){const ia=st[ov.a]===ov.from?ov.a:st.indexOf(ov.from),ie=st[ov.e]===ov.to?ov.e:st.lastIndexOf(ov.to);if(ia>=0&&ie>ia){a=ia;e=ie}}
  const opt=(sel,from,to)=>st.map((s,i)=>i>=from&&i<=to?`<option value="${i}"${i===sel?" selected":""}>${i+1}. ${esc(short(s))}</option>`:"").join("");
  return`<div class="dirbox" data-n="${n}" data-k="${k}"><div class="t"><span>Sens ${k+1} · vers ${esc(short(st[last]))}</span>${ov?`<span class="badge warn">Modifié</span>`:`<span class="badge">Par défaut</span>`}</div>
    <div class="frow"><label class="fld"><select class="sa" aria-label="Arrêt de départ">${opt(a,0,last-1)}</select></label><label class="fld"><select class="se" aria-label="Arrêt d’arrivée">${opt(e,1,last)}</select></label></div>
    <div class="frow" style="justify-content:space-between"><span class="sub">Service assuré de l’arrêt ${a+1} à l’arrêt ${e+1}</span><span style="display:flex;gap:6px;flex:0 0 auto"><button class="btn g sm" data-a="reset"${ov?"":" disabled"}>Par défaut</button><button class="btn sm" data-a="save">Appliquer</button></span></div></div>`;
}
async function vLig(){
  A.innerHTML=`<div class="hero v"><h2>Lignes</h2><p class="hint">Désactive une ligne (elle devient « suspendue » pour tout le monde) et ajuste le partiel assuré dans chaque sens.</p></div><div class="lgrid" id="lg"><p class="empty">Chargement…</p></div>`;
  await guard(cfLoad);
  if(tab!=="lig")return;
  $("#lg").innerHTML=ORDER.filter(n=>LINES[n]).map((n,j)=>{const c=LINES[n].c,on=lineIsOn(n);
    return`<section class="card lcard${on?"":" offl"}" data-n="${n}" style="--i:${j};animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:${j*35}ms"><div class="lhd"><span class="lb" style="--lc:${c};--li:${ink(c)}">${n}</span>
      <div class="ub"><b>Ligne ${n}</b><small class="state">${on?"Active":"Désactivée"}</small></div><button type="button" class="sw" role="switch" aria-checked="${on}" aria-label="Activer la ligne ${n}"></button></div>${[0,1].map(k=>dirBox(n,k)).join("")}</section>`}).join("");
  const L=$("#lg");
  L.onclick=async e=>{
    const sw=e.target.closest(".sw");
    if(sw){const card=sw.closest(".lcard"),n=card.dataset.n,on=sw.getAttribute("aria-checked")!=="true";
      sw.setAttribute("aria-checked",on);card.classList.toggle("offl",!on);card.querySelector(".state").textContent=on?"Active":"Désactivée";
      const ok=await guard(()=>on?api("DELETE","config/lines/"+n):api("PUT","config/lines/"+n,{on:false,t:Date.now()}));
      if(ok===undefined){sw.setAttribute("aria-checked",!on);card.classList.toggle("offl",on);card.querySelector(".state").textContent=on?"Désactivée":"Active";return}
      if(on)delete CF.lines[n];else CF.lines[n]={on:false};toast(`Ligne ${n} ${on?"activée":"désactivée"}`);return}
    const b=e.target.closest("[data-a]");if(!b)return;
    const box=b.closest(".dirbox"),n=box.dataset.n,k=+box.dataset.k,st=LINES[n].s[k];
    if(b.dataset.a==="save"){
      const a=+box.querySelector(".sa").value,en=+box.querySelector(".se").value;
      if(!(en>a)){toast("L’arrêt d’arrivée doit être après l’arrêt de départ.");return}
      const rec={a,e:en,from:st[a],to:st[en]};
      const r=await guard(()=>api("PUT",`config/svc/${n}/${k}`,rec));if(r===undefined)return;
      (CF.svc[n]=CF.svc[n]||{})[k]=rec;
    }else{const r=await guard(()=>api("DELETE",`config/svc/${n}/${k}`));if(r===undefined)return;if(CF.svc[n])delete CF.svc[n][k]}
    box.outerHTML=dirBox(n,k);toast(`Ligne ${n} · sens ${k+1} mis à jour`);
  };
  L.addEventListener("change",e=>{
    const box=e.target.closest(".dirbox");if(!box)return;
    const sa=box.querySelector(".sa"),se=box.querySelector(".se");
    if(+se.value<=+sa.value){const nx=Math.min(LINES[box.dataset.n].s[+box.dataset.k].length-1,+sa.value+1);se.value=nx}
    box.querySelector(".sub").textContent=`Service assuré de l’arrêt ${+sa.value+1} à l’arrêt ${+se.value+1}`;
  });
}

    const d=await GET(path());if(tab!=="dis")return;
    const es=Object.entries(d||{}).filter(([,v])=>v&&v.m).sort((a,b)=>a[1].t-b[1].t).slice(-80);
    $("#dm").innerHTML=es.length?es.map(([id,v])=>`<div class="cmsg"><span><b>${esc(v.a||"?")}</b><small>${fdt(v.t-GAME_OFFSET)}</small><br>${esc(v.m)}</span><button class="xbtn x" data-id="${id}" aria-label="Supprimer">×</button></div>`).join(""):`<p class="lab">Aucun message dans ce salon.</p>`;
  };
  $("#dc").onchange=e=>{dsel=e.target.value;guard(draw)};
  $("#dm").onclick=async e=>{const b=e.target.closest("[data-id]");if(!b)return;await guard(()=>api("DELETE",`${path()}/${b.dataset.id}`));b.closest(".cmsg").remove();toast("Message supprimé")};
  await guard(draw);autoRefresh(()=>guard(draw),6000);
}

gate();
</script></body></html>
