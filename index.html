 $("#bk").onclick=dest;$("#adv").onclick=next;$("#prv").onclick=prev;
 [["m5",-5],["m1",-1],["p1",1],["p5",5]].forEach(([id,v])=>$("#"+id).onclick=()=>ecart(v));

function next(){if(line==null||dir===null)return;if(i<R().length-1){i++;upd();push()}else flip()}
function prev(){if(line==null||dir===null)return;if(i>0){i--;upd();push()}}

addEventListener("keydown",e=>{if(line==null||dir===null||!$("#nx"))return;
 const m={PageDown:next,PageUp:prev,ArrowUp:()=>ecart(1),ArrowDown:()=>ecart(-1)}[e.key];if(m){e.preventDefault();m()}});

 n.style.animation="none";n.offsetWidth;n.style.animation="";n.textContent=s[i];
 $("#lb").textContent=i==last?"Terminus":i==0?"Départ":"Prochain arrêt";

 $("#ls").innerHTML=s.slice(i+1,i+8).map((x,k)=>`<li class="${k?"":"t"}" style="animation-delay:${k*60}ms">${x}</li>`).join("")||`<li class="t">Fin de service du sens</li>`;
 const nm=$("#nm"),st=$("#st"),c=dl>0?"var(--late)":dl<0?"var(--ok)":"var(--y)";
