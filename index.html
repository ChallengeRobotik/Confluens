<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#162343">
<meta name="description" content="SSE+ - Votre appli de référence sur Seine Sud Est!.">
<title>SSE+</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300266b'/%3E%3Ctext x='32' y='46' font-family='Arial' font-weight='700' font-size='40' text-anchor='middle' fill='%23fff'%3ER%3C/text%3E%3C/svg%3E">
<!--
  ==========================================================
  COULEURS DES LIGNES — Seine Sud Est (données de référence)
  ==========================================================
  Ligne | Couleur
  134   | #9a0e54
  135   | #ffbe00
  142   | #c4a2cb
  149   | #6e6e00
  233   | #008080
  242   | #003da4
  257   | #74dc65
  315   | #dbac29
  316   | #c21727
  433   | #00643c
  N76   | #f51c28
  Appliquées via LINE_COLOR (JS) : pastilles de ligne, grille de choix,
  fiches de service, barres et boutons.
-->
<style>
@font-face{font-family:Parisine;src:url(Parisine-Regular.otf) format("opentype");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-Bold.otf) format("opentype");font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-Italic.otf) format("opentype");font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-BoldItalic.otf) format("opentype");font-weight:700;font-style:italic;font-display:swap}
/* =========================================================
   THÈME UNIQUE — marine / bleu RATP / orange LED
   Surfaces claires sur fond marine, un seul jeu de couleurs.
   ========================================================= */
:root{
  --page:#0e1628;        /* fond de page */
  --bar:#162343;         /* barre du haut */
  --ink:#425ba2;         /* texte sur surface claire */
  --blue:#2458c4;        /* action principale */
  --blue-h:#2f66d8;      /* action principale (survol) */
  --blue-d:#173c8c;      /* bleu profond (hero) */
  --surface:#e6ebf5;     /* cartes */
  --surface-2:#f4f6fb;   /* champs / sous-blocs */
  --muted:#425ba2;       /* texte secondaire sur clair */
  --line:rgba(18,40,90,.14);
  --on-dark:#fff;
  --on-dark-2:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.12);
  --led:#ff8a00;         /* accent LED (focus, A/B, coches) */
  --warn-bg:#f3ead3;--warn-ink:#5f4a1c;--warn-bar:#d9b45a;
  --ok:#0a8a4a;--late:#d6281c;
  --y:#425ba2;           /* « à l’heure » = encre */
  --lc:#2458c4;          /* couleur de ligne (réglée par le JS) */
  --bf:brightness(0) invert(17%) sepia(95%) saturate(3500%) hue-rotate(215deg);
  --arr:none;            /* filtre des flèches : blanches par défaut */
  --r:16px;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--page);scroll-behavior:smooth;min-height:100%}
body{min-height:100vh;background:var(--page);color:var(--on-dark);font-family:Parisine,"Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--led);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main{position:relative;max-width:1100px;margin:auto;padding:clamp(16px,4vw,40px);padding-bottom:calc(60px + env(safe-area-inset-bottom))}
h1{font-size:clamp(34px,7vw,66px);line-height:1;color:var(--on-dark);font-weight:700;letter-spacing:-.02em;margin:.1em 0 .2em}
h2{font-size:clamp(28px,5.6vw,48px);line-height:1.05;letter-spacing:-.02em;margin:.1em 0 .25em;font-weight:700;color:var(--on-dark)}
.tag,.sec{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--on-dark-2)}
.sec{margin:28px 0 12px}
.hint{color:var(--on-dark-2);margin:6px 0 0;font-size:16px;line-height:1.4;max-width:560px}
.hero{margin:6px 0 20px}.hero .hint{margin:4px 0 0}
.hint .ico{display:none}
.v{animation:in .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
@keyframes pt{0%,49.99%{opacity:1}50%,100%{opacity:0}}

/* ---------- Images : flèches & logo RER ---------- */
.arr{display:inline-block;height:.82em;width:auto;vertical-align:-.08em;object-fit:contain;pointer-events:none;filter:var(--arr)}
.arr-dbl{display:inline;height:1.05em;max-height:18px;width:auto;vertical-align:-.18em;margin:0 5px;object-fit:contain;pointer-events:none;filter:var(--arr)}
.btn .arr{height:.9em;margin:0 4px}
.btn-idl{height:24px;width:auto;object-fit:contain;border-radius:4px;vertical-align:middle;pointer-events:none}
.rer{height:1.1em;width:auto;max-width:none;object-fit:contain;flex:none;vertical-align:-.16em;margin-left:15px;filter:none}

/* ---------- Surfaces claires : texte encre + flèches bleues ---------- */
.card,.row,.bcard,.lcard,.route,.srch{--arr:var(--bf)}
.card{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:clamp(18px,3vw,28px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lab{color:var(--muted);font-style:italic;font-size:15px}
.badge{display:inline-block;background:rgba(18,40,90,.1);color:var(--ink);padding:3px 11px;border-radius:99px;font-size:13.5px;font-weight:700}

/* ---------- Boutons ---------- */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--blue);color:#fff;--arr:none;transition:transform .15s,background .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--blue-h)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
/* secondaire sur fond sombre */
.btn.g{background:var(--glass);color:#fff;--arr:none}
.btn.g:hover{background:rgba(255,255,255,.2)}
/* secondaire sur carte claire */
.card .btn.g{background:#fff;color:var(--ink);--arr:var(--bf);box-shadow:inset 0 0 0 1px var(--line)}
.card .btn.g:hover{background:#eef2fb}
.btn.g.on,.card .btn.g.on{background:var(--blue);color:#fff;--arr:none;box-shadow:none}
/* bouton blanc « commencer la ligne » */
.btn.sheet-go{background:#fff;color:var(--ink);--arr:var(--bf);box-shadow:0 1px 4px rgba(18,40,90,.18)}
.btn.sheet-go:hover{background:#eaf0ff}

.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top .lg{height:48px;width:auto;border-radius:8px;display:block}
.top .btn{height:48px}

/* ---------- Barre du haut ---------- */
#hdr{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:var(--bar);border-bottom:1px solid rgba(255,255,255,.08)}
#hdr .hi{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:10px clamp(16px,4vw,40px)}
.gt{margin-right:auto;min-width:0}
#hg{display:block;font-size:clamp(22px,5vw,32px);font-weight:700;line-height:1.05;letter-spacing:-.01em;color:#fff}
#hd{display:block;font-size:13px;color:var(--on-dark-2);margin-top:2px}#hd:first-letter{text-transform:uppercase}
#hc{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(18px,3.6vw,24px);color:var(--led);background:#000;padding:6px 12px;border-radius:9px}
#hdr nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass)}
#hdr nav button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 20px;background:transparent;color:#fff;cursor:pointer;opacity:.78;transition:.2s}
#hdr nav button:hover{opacity:1}
#hdr nav button.on{background:var(--surface);color:var(--ink);opacity:1}

/* ---------- Départs ---------- */
.bd{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:10px;align-items:stretch}
.pop .rowx{animation:in .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
.row{flex:1;min-width:0;display:flex;align-items:stretch;min-height:86px;padding:0;overflow:hidden;font:inherit;text-align:left;cursor:pointer;border:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s,background .15s}
button.row:hover{transform:translateY(-1px);background:#eef2fa}
button.row:active{transform:scale(.99)}
.row.off{cursor:default}
.rowx.off .row{background:#c3c9d8;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.rowx.off .dn{color:#7a839e}
.rowx.off .tb b{opacity:.5}
.rowx.off .more{cursor:default;pointer-events:none;opacity:.35}
.lb{position:relative;flex:0 0 128px;width:128px;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,8vw,56px);font-weight:700;letter-spacing:-.02em;background:var(--lc)}
.lb.tri:after{content:"";position:absolute;inset:0;background:#000;clip-path:polygon(100% 0,100% 100%,0 100%);animation:pt 2s linear infinite}
.dn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 18px;color:var(--ink);font-weight:700;font-size:clamp(18px,3.8vw,30px);line-height:1.1}
.tb{display:grid;grid-template-columns:repeat(2,92px);gap:8px;align-items:center;padding:0 14px 0 6px}
.tb b{height:48px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#000;color:var(--led);font-size:26px;font-variant-numeric:tabular-nums}
.tb b.end{grid-column:1/-1;font-size:22px;padding:0 16px}
.more{flex:none;width:58px;display:grid;place-items:center;border:0;border-radius:14px;background:var(--glass);color:#fff;cursor:pointer;transition:background .2s}
.more:hover{background:rgba(255,255,255,.22)}

/* ---------- Choix du sens ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;margin:16px 0 18px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.seg button{font:inherit;color:#fff;background:transparent;border:0;border-radius:15px;padding:12px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;--arr:none;transition:background .2s,color .2s}
.seg button small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.seg button b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:clamp(15px,3.4vw,21px);line-height:1.15}
.seg button:not(.on) .rer{background:#fff;border-radius:5px;padding:2px 3px}
.seg button.on{background:var(--surface);color:var(--ink);--arr:var(--bf)}

/* ---------- Partiel libre ---------- */
.pl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:18px;align-items:start}
.srch{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #c5cde0;color:var(--muted)}
.srch:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:13px 0}
.rl{list-style:none;margin:12px 0 0;padding:0}
.rl li{position:relative}
.rl li:before,.rl li:after{content:"";position:absolute;left:21px;width:6px;margin-left:-3px;top:0;bottom:0;background:var(--lc)}
.rl li:before{opacity:.25}
.rl li:first-child:before{top:50%}.rl li:last-child:before{bottom:50%}
.rl li:after{opacity:0;transition:opacity .25s;pointer-events:none}
.rl li.lit:after,.rl li.a:after,.rl li.b:after{opacity:1}
.rl li.a:after{top:50%}.rl li.b:after{bottom:50%}
.rl button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 10px 6px 0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:14px;transition:background .15s,opacity .2s}
.rl button:hover{background:rgba(36,88,196,.08)}
.pin{flex:none;width:42px;display:grid;place-items:center}
.pin i{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--lc);box-shadow:0 0 0 2px rgba(18,40,90,.18);display:grid;place-items:center;font:700 15px/1 Parisine,system-ui,sans-serif;font-style:normal;color:#fff;transition:all .2s}
.rl li.lit .pin i{border-color:var(--ink)}
.rl li.a .pin i,.rl li.b .pin i{width:34px;height:34px;border:0;background:var(--ink);box-shadow:0 0 0 3px var(--led)}
.rl li.a .pin i:after{content:"A"}.rl li.b .pin i:after{content:"B"}
.rl li.dflt .pin i{opacity:.6}
.rl li.out button{opacity:.5}
.rl .nm{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-weight:700;font-size:clamp(16px,3.2vw,19px);line-height:1.2}
.rl li.a .nm:after,.rl li.b .nm:after{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff;background:var(--ink)}
.rl li.a .nm:after{content:"Départ"}
.rl li.b .nm:after{content:"Arrivée";background:var(--led);color:#000}
.rl li.dflt .nm:after{content:"Terminus"}
.sum{position:sticky;top:98px;display:flex;flex-direction:column;gap:14px}
.route{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pt{display:flex;align-items:center;gap:12px;min-width:0;font-weight:700;font-size:clamp(17px,3.6vw,21px);line-height:1.15;color:var(--ink)}
.pt em,.pt small{font-style:normal;font-weight:400;color:var(--muted);font-size:.8em;margin-left:6px}
.pn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:14px;font-style:normal;font-weight:700}
.pn.b{background:var(--led);color:#000}
.mt,.chips{display:flex;gap:8px;flex-wrap:wrap}
.ck{flex:none;font:inherit;font-weight:700;font-size:20px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 13px;border:0;border-radius:10px;cursor:pointer;background:#000;color:var(--led);transition:transform .15s;font-variant-numeric:tabular-nums}
.ck:hover{transform:translateY(-2px)}
.ck small{white-space:nowrap;font-size:11px;font-weight:400;color:#aaa}
.sum .act{margin:0}.sum .act .btn{flex:1 1 100%;font-size:18px;padding:16px}
.two{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.two .btn{padding:10px 8px;font-size:14px}

/* ---------- Régulation en cours ---------- */
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.dest{font-size:clamp(22px,4vw,36px);font-weight:700;margin:4px 0 14px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;color:var(--ink)}
.next{font-size:clamp(32px,6.5vw,66px);font-weight:700;color:var(--ink);line-height:1.08;min-height:2em;animation:in .45s both}
.nx{display:flex;align-items:center;gap:.35em}
.dot{flex:none;width:.68em;height:.68em;border-radius:50%;background:#fff;border:.15em solid var(--lc);animation:pop .5s both}
.rm{margin:6px 0 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.bar{height:9px;background:rgba(18,40,90,.14);border-radius:9px;margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lc);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.list{list-style:none;padding:0;margin:4px 0 0;position:relative}
.list li{position:relative;padding:11px 0 11px 42px;font-size:clamp(16px,2.4vw,20px);color:var(--ink);animation:in .5s both;background:linear-gradient(var(--lc),var(--lc)) 8px 0/4px 100% no-repeat}
.list li:first-child{background-size:4px 50%;background-position:8px 100%;font-weight:700}
.list li:last-child{background-size:4px 50%;background-position:8px 0}
.list li:only-child{background:none}
.list li:before{content:"";box-sizing:border-box;position:absolute;left:0;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--lc);box-shadow:0 0 0 2px rgba(18,40,90,.2)}
.list li.t:before{box-shadow:0 0 0 3px var(--ink)}
.tm{float:right;color:var(--muted);font-size:14px;font-weight:400;font-variant-numeric:tabular-nums;margin-left:12px}
.dep{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.dep .lab{font-size:14px}
.dep input[type=time]{font:inherit;padding:10px 14px;border-radius:12px;background:#fff;color:var(--ink);border:1px solid #b9c2d8;color-scheme:light}
.dep .btn{padding:10px 14px;font-size:14px}
.delta{text-align:center;display:flex;flex-direction:column;justify-content:center}
.num{font-size:clamp(64px,14vw,120px);font-weight:700;line-height:1;transition:color .4s;font-variant-numeric:tabular-nums;margin:8px 0}
.st{font-size:20px;font-weight:700;letter-spacing:.06em;transition:color .4s}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ctl .btn{min-width:62px;font-size:24px}
.act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.act .btn{flex:1 1 210px;font-size:18px;padding:15px 18px}

/* ---------- Fiches : choix des bus / lignes ---------- */
.steps{display:flex;gap:8px;margin:14px 0 6px}
.steps i{width:34px;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.steps i.on{background:var(--led)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.bcard{position:relative;display:block;padding:0;margin:0;border:0;border-radius:var(--r);overflow:hidden;background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:transform .15s}
.bcard:hover{transform:translateY(-2px)}
.bcard .bimg{display:block;width:100%;height:auto}
.bcard .bn{display:block;padding:8px 12px;font-weight:700;font-size:14.5px;color:var(--ink)}
.bcard .tick{position:absolute;top:0;right:0;width:30px;height:30px;display:none;align-items:center;justify-content:center;background:var(--led);color:#000;font-weight:900;border-bottom-left-radius:14px}
.bcard.on{outline:3px solid var(--led);outline-offset:-3px}.bcard.on .tick{display:flex}
.bcard.free{cursor:default}.bcard.free:hover{transform:none}

/* ---------- Fiche de service « ma journée » ---------- */
#f-view .card{background:linear-gradient(135deg,#2358c9,var(--blue-d));color:#fff;box-shadow:none;--arr:none}
#f-view .card .lab{color:var(--on-dark-2)}
#f-view .f-bus{font-size:24px;font-weight:700;color:#fff}
#f-view .card .badge{background:rgba(255,255,255,.16);color:#fff}
.f-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.f-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.f-launch-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}

.f-sheet{display:grid;grid-template-columns:28px 1fr;gap:0 14px;align-items:start;position:relative}
.f-rail{position:relative;width:28px;min-height:100%}
.f-rail-line{position:absolute;left:50%;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.4) 0 6px,transparent 6px 12px);z-index:0}
.f-node{position:absolute;left:50%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;border-radius:50%;border:4px solid #fff;background:var(--blue-d);z-index:1}
.f-blocks{display:flex;flex-direction:column;gap:12px}

.f-card{position:relative;overflow:hidden;border-radius:var(--r);padding:16px 20px 16px 24px;background:var(--surface);color:var(--ink);--arr:var(--bf);animation:in .45s both}
.f-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc,#8da0c8)}
.f-card.run{background:var(--surface-2)}
.f-card.brk{background:var(--warn-bg);color:var(--ink);padding:14px 20px 14px 24px}
.f-card.brk:before{background:var(--warn-bar)}
.f-card.brk .lab{color:var(--ink)}
.f-row{display:flex;align-items:center;gap:14px}
.f-ico{height:38px;width:auto;max-width:52px;object-fit:contain;flex:none}
.f-title{font-size:clamp(19px,3vw,25px);font-weight:700;line-height:1.15;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.f-card.brk .f-title{color:var(--ink)}
.f-sub{font-size:clamp(15px,2.3vw,19px);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;color:var(--ink)}
.f-route{position:relative;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.f-route:before{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:4px;border-radius:2px;background:var(--lc)}
.f-pt{position:relative;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--ink);z-index:1}
.f-pt span.o{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--ink);flex:none}
.f-line-tag{position:relative;display:flex;align-items:center;gap:10px;padding-left:28px;font-size:14px;color:var(--ink);z-index:1}
.f-line-tag em{color:var(--muted)}
.f-line-tag img.hlp-lg{height:30px;width:auto;object-fit:contain;border-radius:5px;flex:none}
.f-card .badge{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.f-endpoints{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;font-size:14px;color:var(--ink)}
.f-endpoints b{display:block;color:var(--muted);font-weight:400;font-style:italic;font-size:12.5px}


/* ---------- Pastilles de ligne (couleurs Seine Sud Est) ---------- */
.lbg{display:inline-flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(160deg,color-mix(in srgb,var(--lc) 86%,#fff),var(--lc) 60%);color:var(--li,#fff);font-weight:800;letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.28),0 2px 6px color-mix(in srgb,var(--lc) 45%,transparent)}
.lbg.s{font-size:14px;height:24px;min-width:38px;padding:0 9px;border-radius:7px}
.lbg.m{font-size:18px;height:34px;min-width:52px;padding:0 12px;border-radius:10px}
.lbg.l{font-size:21px;height:40px;min-width:60px;padding:0 14px;border-radius:12px}
.lbg.xl{font-size:26px;height:48px;min-width:72px;padding:0 16px;border-radius:13px}

/* ---------- Menu des lignes ---------- */
.cnt{display:inline-flex;gap:4px;padding:5px;border-radius:16px;background:rgba(18,40,90,.08);margin-bottom:18px}
.cnt button{font:inherit;font-weight:800;font-size:20px;min-width:54px;height:46px;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.cnt button:hover{background:rgba(255,255,255,.7)}
.cnt button.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(36,88,196,.45)}
.line-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lcard{position:relative;display:flex;flex-direction:column;padding:0;border:0;border-radius:18px;overflow:hidden;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:0 2px 10px rgba(18,40,90,.16);transition:transform .18s,box-shadow .18s;--arr:var(--bf)}
.lcard:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(18,40,90,.24)}
.lcard .lh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--lc) 82%,#fff),var(--lc) 55%,color-mix(in srgb,var(--lc) 78%,#000));color:var(--li)}
.lcard .ln{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.lcard .lk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2.5px solid color-mix(in srgb,var(--li) 55%,transparent);color:transparent;font-weight:900;font-size:16px;transition:all .18s}
.lcard .lb2{display:flex;flex-direction:column;gap:4px;padding:13px 16px 15px;font-size:13.5px;line-height:1.3;font-weight:600}
.lcard .lb2 .sep-v{line-height:1}
.lcard.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--lc),0 12px 26px rgba(0,0,0,.3);transform:translateY(-2px)}
.lcard.on .lk{background:var(--li);border-color:var(--li);color:var(--lc)}
.lcard.on .lb2{background:color-mix(in srgb,var(--lc) 12%,#fff)}
@media(max-width:560px){.line-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lcard .ln{font-size:28px}.lcard .lb2{font-size:12.5px;padding:11px 12px 13px}.lcard .lh{padding:10px 12px}}

/* ---------- Fiches de service : couleurs de ligne ---------- */
.f-card.run,.f-card.hlp{background:linear-gradient(100deg,color-mix(in srgb,var(--lc) 15%,#fff) 0%,#fff 62%);box-shadow:0 0 0 1px color-mix(in srgb,var(--lc) 24%,transparent),0 4px 14px rgba(0,0,0,.18)}
.f-card.run:before,.f-card.hlp:before{width:9px;background:linear-gradient(180deg,var(--lc),color-mix(in srgb,var(--lc) 65%,#000))}
.f-card.run .f-endpoints{border-top-color:color-mix(in srgb,var(--lc) 30%,transparent)}
.f-card.run .badge{background:color-mix(in srgb,var(--lc) 14%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lc) 35%,transparent)}
.f-card.run .f-endpoints b{color:color-mix(in srgb,var(--lc) 55%,var(--ink))}
.f-card.run .btn.sheet-go{background:linear-gradient(160deg,color-mix(in srgb,var(--lc) 86%,#fff),var(--lc));color:var(--li);box-shadow:0 3px 10px color-mix(in srgb,var(--lc) 45%,transparent)}
.f-card.run:not(.lt) .btn.sheet-go{--arr:none}
.f-card.run .btn.sheet-go .lbg{background:var(--li);color:var(--lc);box-shadow:none}
.f-pt span.o{border-color:var(--lc,var(--ink))}
.f-card.brk{background:linear-gradient(100deg,#f6edd4,#fbf6e8)}
.f-node{background:var(--lc,var(--blue-d));box-shadow:0 0 0 3px rgba(255,255,255,.18)}


/* ---------- Responsive ---------- */
@media(max-width:860px){
  .pl{grid-template-columns:minmax(0,1fr)}.pl>*{min-width:0}
  .sum{top:auto;bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;gap:10px;padding:14px;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
  .sum .h{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto}
  .route{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
@media(max-width:560px){
  #hdr nav{order:3;width:100%}#hdr nav button{flex:1}
  .lb{flex-basis:86px;width:86px;font-size:36px}.dn{padding:0 8px;font-size:15px;overflow:hidden;flex-wrap:wrap}
  .tb{grid-template-columns:repeat(2,54px);gap:4px;padding:0 6px 0 0}.tb b{height:40px;font-size:18px}.tb b.end{font-size:15px;padding:0 8px}
  .more{width:42px}.rowx{gap:6px}
}

/* =========================================================
   REFONTE PROPRE — indices plats (comme l'accueil), menu des lignes, fiche
   ========================================================= */
.lbg{background:var(--lc);color:var(--li,#fff);font-weight:700;letter-spacing:0;box-shadow:none;border-radius:7px}

.lbg.m{font-size:19px;height:32px;min-width:52px;padding:0 10px;border-radius:8px}
.lbg.l{font-size:24px;height:40px;min-width:62px;padding:0 12px;border-radius:9px}
.lbg.xl{font-size:28px;height:48px;min-width:72px;padding:0 14px;border-radius:10px}

/* Menu des lignes : panneau gris légèrement plus clair que le fond */
.card.pk{background:#171f33;color:#fff;box-shadow:none;--arr:none}

.pk .cnt button.on{background:var(--blue);color:#fff;opacity:1;box-shadow:none}
.pk .line-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pk .lcard{flex-direction:row;align-items:stretch;min-height:74px;border-radius:12px;background:#222c45;color:#fff;box-shadow:none;--arr:none;transition:background .15s,box-shadow .15s}

.pk .lcard .lb2{flex:1;min-width:0;justify-content:center;gap:2px;padding:10px 12px 10px 14px;font-size:14px;font-weight:700;line-height:1.25;color:#fff}

.pk .lcard .lb2 .sep-v .arr{height:.78em;opacity:.6;margin:0}

.pk .lcard.on{background:#2a3554;box-shadow:inset 0 0 0 2px #fff;transform:none}

@media(max-width:560px){.pk .line-cards{grid-template-columns:1fr;gap:8px}.pk .lcard .lbk{font-size:28px;flex-basis:68px}.pk .lcard .lb2{font-size:14px;padding:10px 12px}}

/* Fiche de service : tout à plat */
#f-view .card{background:#1d4ab0;box-shadow:none;border-radius:var(--r)}
#f-view .f-bus{font-size:26px;font-weight:700}
#f-view .card .badge{background:rgba(255,255,255,.14);box-shadow:none;font-weight:700}
.f-launch-bar{gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18)}

.f-launch-bar .btn.sheet-go:hover{background:#eef2fb}

.f-node{background:var(--lc,var(--blue-d));border-color:var(--page);box-shadow:none}

/* =========================================================
   ÉCRANS NV — choix des véhicules, choix des lignes, régulation
   (surcouche plein écran, indépendante du thème de l'accueil)
   ========================================================= */
html.nv-open,html.nv-open body{overflow:hidden}
#nv{position:fixed;inset:0;z-index:200;font-family:Parisine,"Trebuchet MS",system-ui,sans-serif;--arr:none;animation:nvin .25s ease-out both}
#nv[hidden]{display:none}
@keyframes nvin{from{opacity:0}to{opacity:1}}
:where(#nv) *{box-sizing:border-box;margin:0}
#nv button{font:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
.nv-sc{position:absolute;inset:0;display:flex;flex-direction:column;background:#666;color:#fff;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.nv-top{flex:none;background:#4b4848;padding:6px 14px 8px;border-bottom:1px solid #353333;box-shadow:0 2px 4px rgba(0,0,0,.35);position:relative;z-index:2}
.nv-top h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:0;margin:0;color:#fff;display:flex;align-items:center;gap:6px}
.nv-top h1 .arr{height:.78em;margin:0}
.nv-top p{font-style:italic;font-size:13px;color:#fff;margin:0;line-height:1.25}
.nv-mid{flex:1;min-height:0;overflow:auto;padding:14px 14px 22px}
.nv-bot{flex:none;background:#4b4848;border-top:1px solid #353333;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.nv-red{background:#d0191f;color:#fff;font-weight:700;font-size:20px;height:44px;padding:0 24px 0 14px;border-radius:5px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 3px rgba(0,0,0,.4);transition:background .15s,transform .15s}
.nv-red:hover{background:#e5242a}.nv-red:active,.nv-gray:active{transform:scale(.97)}
.nv-red .arr{height:.9em;margin:0}
.nv-gray{background:#a3a3a3;color:#fff;font-weight:700;font-size:20px;height:44px;min-width:min(425px,55vw);padding:0 14px 0 14px;border-radius:5px;display:flex;align-items:center;justify-content:space-between;gap:30px;box-shadow:0 2px 3px rgba(0,0,0,.35);transition:background .15s,transform .15s}
.nv-gray:hover{background:#b6b6b6}
.nv-gray .arr{height:.9em;margin:0}
.nv-top.cn{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nv-cnt{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:700}
.nv-cnt button{width:34px;height:34px;border-radius:5px;background:transparent;color:#fff;font-size:20px;font-weight:700;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:background .15s}
.nv-cnt button:hover{background:rgba(255,255,255,.14)}
.nv-cnt b{min-width:26px;text-align:center;font-size:22px;color:#ff8a00;font-variant-numeric:tabular-nums}
.nv-mini{display:flex;gap:8px}
.nv-mini button{background:transparent;color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:background .15s}
.nv-mini button:hover{background:rgba(255,255,255,.14)}

/* ---- Écran 1 : constructeurs + véhicules ---- */
.nv-pan{max-width:1225px;margin:0 auto;background:#555;border:1px solid #444;border-radius:9px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nv-tabs{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:10px;overflow-x:auto;padding-bottom:2px}
.nv-tab{height:44px;border:0;border-radius:6px;isolation:isolate;background:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.nv-tab img{width:100%;height:100%;object-fit:contain;pointer-events:none;transition:filter .15s,transform .15s}
.nv-tab:hover:not(.on) img{transform:translateY(-2px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.nv-tab.on{background:#0b94ff}.nv-tab.on img{filter:invert(1);mix-blend-mode:lighten}
.nv-cards{margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;padding:8px 6px 12px;min-height:290px;background:#666;border-radius:6px;align-content:flex-start}
.nv-bc{position:relative;width:160px;height:250px;border-radius:6px;padding:0;background:transparent;box-shadow:none;transition:transform .2s,box-shadow .2s;animation:nvcard .35s both}
@keyframes nvcard{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nv-bc:hover{transform:translateY(-5px)}
.nv-bc.on{box-shadow:none}
.nv-bc.on:hover{box-shadow:none}
.nv-bw{position:absolute;inset:0;border-radius:5px;overflow:hidden}
.nv-bw img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.nv-bc:hover .nv-bw img{transform:scale(1.07)}

.nv-bt{position:absolute;left:7px;right:26px;bottom:7px;z-index:1;text-align:left;color:#fff;pointer-events:none}
.nv-bt b{display:block;font-size:14.5px;line-height:1.1;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.nv-bt small{display:block;font-size:8px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.nv-ck{position:absolute;right:-9px;bottom:-9px;width:28px;height:28px;object-fit:contain;opacity:0;transform:scale(.3);transition:opacity .18s,transform .22s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:3}
.on>.nv-ck{opacity:1;transform:none}
.nv-empty{color:rgba(255,255,255,.7);font-style:italic;padding:12px}

/* ---- Écran 2 : lignes du réseau ---- */
.nv-grid{display:grid;grid-template-columns:repeat(4,190px);gap:10px 8px;justify-content:center;padding-top:6px}
.nv-lt{position:relative;width:190px;height:197px;border-radius:5px;padding:0;background:transparent;box-shadow:none;transition:transform .22s,box-shadow .22s;animation:nvcard .35s both}
.nv-lt:hover{transform:translateY(-6px) scale(1.045);z-index:3}
.nv-lt.on{box-shadow:0 0 0 3px #fff}
.nv-lt.on:hover{box-shadow:0 0 0 3px #fff}
.nv-lw{position:absolute;inset:0;border-radius:5px;overflow:hidden}
.nv-lw img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s,filter .25s}
.nv-lt:hover .nv-lw img{transform:scale(1.08);filter:brightness(1.08)}

.nv-ov{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;text-align:left;pointer-events:none;color:#fff}
.nv-lg{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.nv-lg .nv-bus{font-size:12px}
.nv-lg .nv-bus.n{font-size:22px}
.nv-lg .nv-pill{font-size:13px;padding:2px 7px;min-width:30px}
.nv-tx{display:block;font-size:11px;font-weight:800;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.nv-tx .arr-dbl{height:.95em;margin:0 0 0 4px;vertical-align:-.12em}
.nv-tx .nv-rer{margin-left:3px}
.nv3-ls .nv-rer{font-size:.74em;margin-left:4px}.nv-tx .nv-rer{font-size:.78em}
.nv-tr{width:.95em;height:.95em;vertical-align:-.12em;margin-left:3px}

/* ---- pastille BUS / ligne / RER (partagé) ---- */
.nv-bus{font-weight:800;font-size:13px;letter-spacing:.02em;line-height:1;padding:2px 1px;border-top:2px solid #fff;border-bottom:2px solid #fff;display:inline-block;color:#fff}
.nv-bus.n{border:0;font-size:26px;padding:0}.nv-bus.n sup{font-size:.55em;vertical-align:.5em}
.nv-pill{font-style:normal;font-weight:800;font-size:14px;line-height:1;padding:3px 8px;border-radius:4px;background:var(--lc);min-width:34px;text-align:center;display:inline-block;color:var(--li,#fff)}
.nv-rer{display:inline-block;border:1.6px solid currentColor;border-radius:4px;font-size:.5em;font-weight:800;line-height:1;padding:.16em .26em .12em;letter-spacing:.02em;vertical-align:.25em;font-style:normal}

/* ---- Écran 3 : régulation ---- */
.nv3{position:absolute;inset:0;display:flex;flex-direction:column;background:#dcdcdc;color:#25303B;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.nv3-h{flex:none;height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(#4a4a4a,#363636);border-bottom:2px solid #2b2b2b;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.4);position:relative;z-index:2}
.nv3-logo{display:flex;align-items:center;gap:7px;background:none;color:#fff;padding:0;transition:opacity .15s}
.nv3-logo:hover{opacity:.78}
.nv3-dir{margin-right:auto;margin-left:2px;display:flex;flex-direction:column;line-height:1;min-width:0}
.nv3-dir small{font-size:9px;font-style:italic}
.nv3-dir b{font-size:22px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nv3-ls li{position:relative;z-index:1;flex:0 0 var(--rh,44px);display:flex;align-items:center;gap:10px}
/* un seul trait continu : de la 1re à la dernière pastille, jamais au-delà */
.nv3-trk{position:absolute;left:9.5px;top:calc(var(--rh,44px)/2);width:3px;height:0;border-radius:2px;background:var(--lc);transition:height var(--td,.4s) cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:0}

/* terminus : pastille plus grande, bague blanche cerclée */

.nv3-tools{display:flex;gap:26px;align-items:flex-start;margin-top:4px}
.nv3-dlt{width:100px;flex:none}
.nv3-dbox{overflow:hidden;padding-left:6px;padding-right:6px;background:#25303B;color:#fff;border-radius:6px;height:90px;display:flex;align-items:baseline;justify-content:center;gap:3px;padding-top:12px}

.nv3-nav{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.nv3-nb{height:38px;border-radius:6px;background:#d2d2d2;color:#25303B;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:background .15s,transform .1s}

.nv3-nb:hover:not([disabled]){background:#bfbfbf}.nv3-nb:active:not([disabled]){transform:scale(.98)}
.nv3-nb[disabled]{color:#a9a9a9;box-shadow:none;cursor:default;background:#cfcfcf}

.nv3-ar-h{display:flex;justify-content:space-between;font-size:11.5px;font-style:italic}

.nv3-ar-r .t{font-size:clamp(22px,2.4vw,30px);font-weight:800;white-space:nowrap}
.nv3-ar-r .t small{font-size:11px;font-style:italic;font-weight:400;margin-left:2px}
.nv3-r{display:flex;flex-direction:column}
.nv3-msgs{flex:1;min-height:0;overflow:auto;margin-top:6px;display:flex;flex-direction:column;gap:7px}

.nv3-msg b{font-weight:800}.nv3-msg em{font-size:10px;color:#777;margin-left:6px;font-style:italic}

.nv3-in{display:flex;gap:6px;margin-top:6px}
.nv3-in input{flex:1;min-width:0;border:0;border-radius:5px;background:#ececec;padding:8px 10px;font:inherit;font-size:14px;color:#25303B;outline:none}

.nv-busimg{height:24px;width:auto;display:block;pointer-events:none}

/* animations écran 3 */
.nv-eta{display:inline-block}
.nv3-ar-r[hidden]{display:none}
.nv3-h{animation:nvdown .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes nvdown{from{transform:translateY(-100%)}to{transform:none}}

@keyframes nvgrow{from{transform:scaleY(0)}to{transform:none}}
.nv3-nb .arr{transition:transform .2s}
.nv3-nb.nx:hover:not([disabled]) .arr{transform:translateX(4px)}
.nv3-nb.pv:hover:not([disabled]) .arr{transform:translateX(-4px)}
.nv3-dbox b{transition:color .25s,font-size .2s}
.nv3-send:active{transform:scale(.95)}

}

}


/* =========================================================
   COMPTE · MODÉRATION
   ========================================================= */
.ovl{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:rgba(14,22,40,.88);animation:nvin .25s ease-out both;overflow:auto}
#lock{z-index:600}
.ovl .card{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.ovl h2{color:var(--ink);font-size:clamp(26px,6vw,34px);margin:0}
.ovl p{color:var(--muted);line-height:1.4}
.ovl .badge{align-self:flex-start}
.rm-err{min-height:1.2em;color:var(--late);font-weight:700;font-size:14px}
.shake{animation:shk .28s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:700;max-width:min(92vw,420px);background:#000;color:var(--led);padding:12px 18px;border-radius:12px;font-weight:700;text-align:center;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.led{font:inherit;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.14em;color:var(--led);background:#000;padding:5px 10px;border-radius:8px;border:0}
button.led{cursor:pointer;height:48px;padding:0 16px;font-size:20px;transition:transform .15s}
button.led:active{transform:scale(.97)}
.gen-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.gen{padding:10px 12px;border-radius:10px;background:var(--surface-2);box-shadow:inset 4px 0 0 var(--led);line-height:1.35;word-break:break-word}



/* ---------- lignes perso · lancements · consignes ---------- */
.frow{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.srch textarea{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:13px 0;resize:vertical;min-height:100px}
.srch select{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:13px 0}
.ovl .card.dlg{width:min(520px,100%)}
.lf-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lf-g label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-style:italic}
.lf-ck{display:flex;gap:8px;align-items:center;color:var(--ink)}

/* ===== Fond unifié, bandeau d'attente, animations ===== */
:root{--bgx:radial-gradient(120% 70% at 50% -10%,#24376b 0%,rgba(36,55,107,0) 60%),linear-gradient(180deg,#14203f 0%,#0e1628 100%);--ez:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bgx) fixed,var(--page)}
.nv-sc{background:var(--bgx),var(--page)}
.nv-top,.nv-bot{background:var(--bar);border-color:rgba(255,255,255,.08);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.nv-top p{font-style:normal;color:var(--on-dark-2)}
.nv-gray{background:var(--blue)}.nv-gray:hover{background:var(--blue-h);transform:translateY(-1px)}
.nv-red:hover{transform:translateY(-1px)}
.nv-tab{background:var(--surface);border-radius:8px;padding:4px 10px;transition:background .2s,transform .2s,box-shadow .2s}
.nv-tab.on{background:#0b94ff;box-shadow:0 6px 16px rgba(11,148,255,.4)}
.wait-hd{display:flex;justify-content:flex-end;margin:0 82px -2px 0;animation:wdin .6s var(--ez) both}
.wait-hd img{width:192px;max-width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
@keyframes wdin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media(max-width:640px){.wait-hd{margin-right:54px}.wait-hd img{width:112px}}
.row{transition:transform .25s var(--ez),box-shadow .25s,filter .25s}
.row:not(.off):hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35);filter:brightness(1.03)}
.row:not(.off):active{transform:scale(.99)}
.more{transition:background .2s,transform .2s var(--ez)}.more:hover{background:rgba(255,255,255,.22);transform:scale(1.06)}
.tb b{transition:transform .25s var(--ez),box-shadow .25s}.row:hover .tb b{box-shadow:0 0 0 1px rgba(255,138,0,.4),0 0 14px rgba(255,138,0,.18)}
#hdr nav button{transition:background .2s,color .2s,transform .2s}#hdr nav button:hover{transform:translateY(-1px)}
.nv-cmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.nv-nums{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.nv-num{width:132px;height:152px;border-radius:16px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .25s var(--ez),box-shadow .25s,background .2s,color .2s;animation:nvcard .45s var(--ez) both}
.nv-num b{font-size:62px;line-height:1;font-variant-numeric:tabular-nums}.nv-num span{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.nv-num:hover{transform:translateY(-6px) scale(1.04)}
.nv-num.on{background:var(--blue);color:#fff;box-shadow:0 0 0 3px var(--led),0 14px 30px rgba(36,88,196,.5);transform:translateY(-4px)}
.nv-cnote{color:var(--on-dark-2);font-size:16px;min-height:1.4em}
@media(max-width:640px){.nv-num{width:clamp(58px,17vw,88px);height:112px}.nv-num b{font-size:40px}.nv-num span{font-size:10px;letter-spacing:.04em}.nv-nums{gap:8px;flex-wrap:nowrap}}
.nv-pan{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.3)}.nv-cards{background:rgba(255,255,255,.04)}
@media(max-width:640px){.nv-bot{gap:6px;padding:7px 8px}.nv-gray{min-width:0;gap:8px;font-size:16px;padding:0 10px}.nv-red{font-size:16px;padding:0 10px;gap:8px}.nv-mini{gap:4px}.nv-mini button{font-size:11px;padding:0 6px}}

/* ===== v3 : menus, régulation, préchargement ===== */
#pre{position:fixed;inset:0;z-index:1000;background:var(--bgx),var(--page);display:grid;place-items:center;transition:opacity .55s ease,visibility .55s}
#pre.out{opacity:0;visibility:hidden;pointer-events:none}
.pre-in{display:flex;flex-direction:column;align-items:center;gap:16px;color:#fff;font-weight:700;letter-spacing:.04em}

@keyframes presp{to{transform:rotate(360deg)}}
.pre-in i{display:block;width:190px;height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}

.nv-steps i.d{background:rgba(255,255,255,.55)}.nv-steps i.on{background:var(--led);width:42px}
.nv-pan{border-radius:20px;padding:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.nv-tabs{gap:12px;padding-bottom:6px}
.nv-tab{height:52px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.nv-tab img{width:62%;height:58%}
.nv-tab:hover:not(.on){transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.nv-tab.on{background:linear-gradient(135deg,#2f66d8,#0b94ff);box-shadow:0 8px 20px rgba(11,148,255,.45)}
.nv-cards{gap:26px 22px;padding:22px 12px 26px;margin-top:12px;border-radius:16px;background:rgba(0,0,0,.16);justify-content:flex-start}
.nv-bc{width:176px;height:262px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .28s var(--ez),box-shadow .28s,filter .28s}
.nv-bw{border-radius:14px}
.nv-bc:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 16px 32px rgba(0,0,0,.55)}
.nv-bc:not(.on){filter:saturate(.75) brightness(.9)}.nv-bc:not(.on):hover{filter:none}
.nv-bc.on,.nv-bc.on:hover{box-shadow:0 0 0 3px var(--led),0 14px 30px rgba(255,138,0,.28)}
.nv-ck{width:32px;height:32px;right:-10px;bottom:-10px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.nv-grid{grid-template-columns:repeat(4,190px);gap:34px 30px;padding:14px 10px 22px}

.nv-ov .nv-busimg{height:17px;filter:brightness(0) invert(1)}

.nv-tx{display:block;font-size:11.5px;margin-top:2px}
.nv-par{display:inline-block;margin-left:6px;vertical-align:-1px;width:11px;height:11px;border-radius:2px;background:linear-gradient(to top left,#000 50%,#fff 50%)}
.nv-rerimg{margin-left:5px}
.nv3{background:var(--bgx),var(--page)}
.nv3-h{background:var(--bar);border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.nv3-ns span{border-bottom:0;padding-bottom:0}
@media(max-width:900px){.nv-grid{grid-template-columns:repeat(2,minmax(0,190px));gap:26px 20px}.nv-cards{gap:20px 14px;justify-content:center}.nv-bc{width:150px;height:224px}}

/* ===== v4 : sobriété — pas d'effets, pas de contours sur les images ===== */
:root{--bgx:linear-gradient(var(--page),var(--page))}
.nv-pan{backdrop-filter:none;border-radius:6px;box-shadow:none;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:12px}

.tb b{border-radius:6px}

.nv3{color:#e8edf8}
.nv3-c{background:#1a274b;box-shadow:none;border-radius:4px}

  berthee:{vallee:3,macmahon:5,federation:6,narberale:5,cramain:8,chaillot:15},

const DEPOT_START=new Set([...Object.keys(DEPOT_HLP.berthee),...Object.keys(DEPOT_HLP.courcelles)]);
let NODES=null;
function lineNodes(){return lineNodesAll().filter(x=>lineOn(x.L))}
function lineNodesAll(){
  if(NODES)return NODES;NODES=[];
  for(const L in DATA)if(!DATA[L].custom)for(const d of [0,1]){
    const st=DATA[L].s[d],[a,b]=svc(L,d);
    if(DATA[L].C[d].some(c=>c.t[a]!=null&&c.t[b]!=null))NODES.push({L,d,a,b,from:canonStop(st[a]),to:canonStop(st[b])})}

const MAX_WAIT=20;
function legEnd(n,cur,first){
  const hl=first?(DEPOT_HLP[n.from==="chaillot"?"courcelles":"berthee"][n.from]||5):4;

  if(!p)return{wait:Infinity,end:cur,dep:cur,hl};
  return{wait:(p.ts-cur)/MIN-hl,dep:p.ts,end:p.base+p.c.t[n.b]*MIN,hl}}
function buildChain(count,prefs,mw=MAX_WAIT){
  const nodes=lineNodes();
  const run=rep=>{let best=[],bs=-1;
    for(let t=0;t<500;t++){
      const ch=[];let cur=null,ts=nowRound();
      while(ch.length<count){
        const c=nodes.filter(n=>(cur===null?DEPOT_START.has(n.from):n.from===cur)&&(rep||!ch.some(x=>x.L===n.L))&&legEnd(n,ts,cur===null).wait<=mw);
        if(!c.length)break;
        const w=c.map(n=>(prefs.includes(n.L)?5:1)*(0.3+Math.random()));
        let r=Math.random()*w.reduce((x,y)=>x+y,0),k=0;while(k<c.length-1&&(r-=w[k])>0)k++;
        ts=legEnd(c[k],ts,cur===null).end;ch.push(c[k]);cur=c[k].to}
      const sc=ch.length*100+ch.filter(n=>prefs.includes(n.L)).length*10+Math.random();
      if(sc>bs){bs=sc;best=ch}}
    return best};
  let best=run(false);if(best.length<count){const b2=run(true);if(b2.length>best.length)best=b2}

function generateDaySheet(){
  const count=Math.min(5,Math.max(1,fState.lineCount||2));
  let chain=[];
  for(const mw of [MAX_WAIT,60,180,600,Infinity]){chain=buildChain(count,fState.prefLines||[],mw);if(chain.length)break}
  const assignedLines=chain.map(n=>n.L);
  const bus=pickBus(assignedLines);
  const startKey=chain[0].from;
  const depotKey=startKey==="chaillot"?"courcelles":"berthee";
  const firstDepot=DEPOTS[depotKey];
  const hlpMin=DEPOT_HLP[depotKey][startKey]||5;
  let curTs=nowRound();
  const segments=[{type:"walk",bus,depot:firstDepot.name,startTime:fmt(curTs)}];
  chain.forEach((n,idx)=>{
    const lCode=n.L,dirIdx=n.d,d=DATA[lCode],st=d.s[dirIdx];

    curTs=arrTs;
  });

}

function nvList(rel,dm,dn,quiet){
  const ul=$("#nv-ls"),s=R(),last=s.length-1;
  if(!ul)return;
  const rh=Math.max(28,Math.min(52,Math.floor(ul.clientHeight/9)||44));
  const rhChanged=ul.style.getPropertyValue("--rh")!==rh+"px";
  ul.style.setProperty("--rh",rh+"px");
  /* 1 pastille = 1 arrêt restant après le prochain (terminus inclus), 9 au maximum */
  const want=[];for(let k=rel+1;k<=last&&want.length<9;k++)want.push(k);
  let trk=ul.querySelector(".nv3-trk");
  if(!trk){trk=document.createElement("i");trk.className="nv3-trk";ul.prepend(trk)}
  const setTrk=n=>{trk.style.height=Math.max(0,n-1)*rh+"px"};
  const rows=[...ul.children].filter(li=>li.dataset&&li.dataset.k!==undefined&&!li.classList.contains("gh"));
  const old=new Map(rows.map(li=>[+li.dataset.k,li]));
  const same=old.size===want.length&&want.every(k=>old.has(k));
  const stamp=li=>{
    const em=li.querySelector("em"),t=fmt(sTs(startIdx+(+li.dataset.k))+dm);
    if(em.textContent===t)return;
    const had=em.textContent!=="";em.textContent=t;
    if(had)anim(em,[{opacity:.2,transform:"translateY(-4px)"},{opacity:1,transform:"none"}],{duration:260,easing:EASE});
  };
  if(same){
    rows.forEach(stamp);
    if(quiet){if(rhChanged){trk.style.transition="none";setTrk(want.length);void trk.offsetHeight;trk.style.transition=""}return}
  }
  const tops=new Map();old.forEach((li,k)=>tops.set(k,li.getBoundingClientRect().top));
  const ulTop=ul.getBoundingClientRect().top;
  /* sortie : l'arrêt disparaît en glissant, sans trait ni double pastille durable */
  old.forEach((li,k)=>{if(!want.includes(k)){
    const r=li.getBoundingClientRect(),g=li.cloneNode(true);
    g.classList.add("gh");g.setAttribute("aria-hidden","true");
    g.style.cssText=`position:absolute;left:0;right:0;top:${r.top-ulTop}px;height:${r.height}px;margin:0;pointer-events:none`;
    ul.appendChild(g);li.remove();
    const a=anim(g,[{opacity:1,transform:"none"},{opacity:0,transform:`translateY(${-rh*1.2*dn}px)`}],{duration:460,easing:"cubic-bezier(.45,0,.2,1)",fill:"forwards"});
    if(a)a.onfinish=()=>g.remove();else g.remove();
  }});
  const first=old.size===0;
  want.forEach((k,j)=>{
    let li=old.get(k);
    if(!li){li=document.createElement("li");li.dataset.k=k;li.innerHTML=`<i class="nv-dot"></i><b>${nvN(s[k])}</b><em></em>`}
    li.className=j===want.length-1?"l":"";
    stamp(li);
    ul.appendChild(li);
  });
  /* trait : se dessine à l'ouverture, puis suit exactement le nombre de pastilles */
  if(first){
    trk.style.transition="none";trk.style.height="0px";void trk.offsetHeight;trk.style.transition="";
    trk.style.setProperty("--td",(300+want.length*50)+"ms");
  }else trk.style.setProperty("--td",".4s");
  setTrk(want.length);
  /* fin de course : plus de pastille, un simple message */
  const note=ul.querySelector(".nv3-endn");
  if(!want.length){
    if(!note){const n=document.createElement("li");n.className="nv3-endn";n.textContent="Dernier arrêt de la course";ul.appendChild(n);
      anim(n,[{opacity:0,transform:"translateY(8px)"},{opacity:.7,transform:"none"}],{duration:380,delay:200,easing:EASE,fill:"backwards"})}
  }else if(note)note.remove();
  want.forEach((k,j)=>{
    const li=ul.querySelector(`li[data-k="${k}"]:not(.gh)`);
    if(old.has(k)){const dy=tops.get(k)-li.getBoundingClientRect().top;if(Math.abs(dy)>1)anim(li,[{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:560,delay:j*30,easing:"cubic-bezier(.45,0,.2,1)",fill:"backwards"})}
    else{
      anim(li,[{opacity:0,transform:`translateY(${rh*(first?.6:1.2)*dn}px)`},{opacity:1,transform:"none"}],{duration:first?400:560,delay:first?j*45:want.length*30,easing:first?EASE:"cubic-bezier(.45,0,.2,1)",fill:"backwards"});
      anim(li.firstChild,[{transform:"scale(.2)"},{transform:"scale(1)"}],{duration:440,delay:first?j*45+60:60,easing:"cubic-bezier(.3,1.6,.5,1)",fill:"backwards"});
    }
  });
}
function nvDelta(){
  const el=$("#nv-d"),box=el.parentNode,to=dl,from=nvShown;

  cancelAnimationFrame(nvTw);
  if(RM||from===to){nvShown=to;paint(to);return}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/300),e=1-Math.pow(1-p,3);nvShown=p<1?Math.round(from+(to-from)*e):to;paint(nvShown);if(p<1)nvTw=requestAnimationFrame(step)};
  nvTw=requestAnimationFrame(step);

}

function alignRailToCards(){

  const cards=[...sheet.querySelectorAll(".f-card")];
  const nodes=[...rail.querySelectorAll(".f-node")];

  if(!cards.length||nodes.length!==cards.length)return;

  const centers=cards.map(c=>{
    const r=c.getBoundingClientRect();
    return (r.top-railRect.top)+(r.height/2);
  });
  nodes.forEach((n,idx)=>{n.style.top=`${centers[idx]}px`});
  if(lineEl&&centers.length){
    const firstY=centers[0];

    lineEl.style.height=`${Math.max(0,lastY-firstY)}px`;
  }

      const p=inp.value.trim().replace(/\s+/g," "),bad=pseudoCheck(p);
      if(bad)return fail(bad);
      btn.disabled=true;
      try{
        await modCheck();if(lockRec){btn.disabled=false;return}
        const all=await jget("accounts"),k=normS(p);
        if(Object.values(all||{}).some(a=>a&&(a.key||normS(a.pseudo||""))===k))return fail("Ce pseudo est déjà pris.");
        const uid="u"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
        const rec={pseudo:p,key:k,created:rn(),seen:rn(),ip:myIp||null};
        const r=await jsend("PUT",`accounts/${uid}`,rec);if(!r.ok)throw new Error("put");
        acct={uid,pseudo:p};ls.set(AK,acct);hook(p,uid);
        o.remove();res();
      }catch(_){fail("Connexion impossible. Réessaie dans un instant.")}
    };
  });
}
function beat(){if(!acct||lockRec)return;const b={seen:rn()};if(myIp)b.ip=myIp;jsend("PATCH",`accounts/${acct.uid}`,b).catch(()=>{})}

/* ---------- modération : exclusion, bannissement compte / IP ---------- */
async function modCheck(){
  let u=null,ip=null,a=true;
  try{[u,ip,a]=await Promise.all([acct?jget(`mod/users/${acct.uid}`):null,myIp?jget(`mod/ips/${ipKey(myIp)}`):null,acct?jget(`accounts/${acct.uid}`):true])}catch(_){return}
  if(acct&&a===null){
    ls.del(AK);acct=null;if(line!=null){leave();line=null;dir=null}nvHide();
    toast("Ton compte a été supprimé.");await signup();home();return;
  }
  if(acct&&a&&a!==true&&a.pseudo&&a.pseudo!==acct.pseudo){acct.pseudo=a.pseudo;ls.set(AK,acct);toast(`Ton pseudo est maintenant « ${a.pseudo} »`)}
  setLock(live(u)?{...u}:live(ip)?{...ip,type:"ban",ipban:true}:null);
}
function setLock(rec){
  let el=document.getElementById("lock");
  if(!rec){lockRec=null;if(el)el.remove();return}
  const fresh=!lockRec;lockRec=rec;
  if(fresh){if(line!=null){leave();line=null;dir=null}nvHide();home()}
  if(!el){el=document.createElement("div");el.id="lock";el.className="ovl";document.body.appendChild(el)}
  const kind=rec.ipban?"Adresse IP bannie":rec.type==="kick"?"Exclusion temporaire":"Compte banni";
  const title=rec.type==="kick"&&!rec.ipban?"Tu as été exclu":"Accès bloqué";
  el.innerHTML=`<div class="card" role="alertdialog" aria-live="assertive"><span class="badge">${kind}</span><h2>${title}</h2>${rec.reason?`<p>Motif : ${esc(rec.reason)}</p>`:""}<div class="lk-t" id="lk-t"></div></div>`;
  lockTick();
}
function lockTick(){
  if(!lockRec)return;
  const t=document.getElementById("lk-t");
  if(lockRec.until===0){if(t)t.textContent="Définitif";return}
  const d=lockRec.until-rn();
  if(d<=0){setLock(null);modCheck();return}
  if(t)t.textContent="Retour dans "+dur(d);
}

/* ---------- messages généraux (administration) ---------- */
async function genPoll(){
  try{const bc=await fetch(`${DB}/broadcast.json?orderBy="$key"&limitToLast=20`).then(r=>r.json());GEN.bc=bc&&!bc.error?Object.entries(bc).map(([id,v])=>({id,...v})):[]}catch(_){}
}
function genLines(){
  const now=rn();
  return GEN.bc.filter(x=>x&&x.m&&x.pub&&(!x.exp||x.exp>now)).sort((a,b)=>a.t-b.t).map(x=>x.m);
}

/* ---------- démarrage ---------- */
async function boot(){
  try{localStorage.removeItem("reg_rooms_v1")}catch(_){}
  acct=ls.get(AK);
  await Promise.all([getIp(),cfgLoad()]);
  await modCheck();
  if(!acct)await signup();
  await genPoll();home();
  setInterval(modCheck,6000);setInterval(()=>{if(acct&&!lockRec)genPoll()},15000);
  setInterval(()=>cfgLoad().then(cfgApply),15000);
  setInterval(beat,60000);setInterval(lockTick,1000);beat();
}

boot();

/* abrev("Place du Général Leclerc",["Général"]) → "Place du Gén. Leclerc" : n'abrège QUE les mots demandés */
const abrev=(t,mots=[])=>{const all={...ABBR_RATP.voirie,...ABBR_RATP.titres,...ABBR_RATP.divers};let o=String(t);mots.forEach(m=>{if(all[m])o=o.replace(new RegExp("(^|[\\s-])"+m+"(?=$|[\\s-])","g"),(_,p)=>p+all[m])});return o};

/* ==== Transitions de pages : glissement droite / gauche ==== */
const PAGE_RANK={home:0,dest:1,go:2,nvBuses:10,nvLines:11,nvCount:12,renderSheetView:13,launchLineRegulation:14};
let curRank=0;
function slidePage(name,fn,args,self){
  const rank=PAGE_RANK[name];
  if(rank===curRank||!document.body.animate){curRank=rank;return fn.apply(self,args)}
  curRank=rank;
  const oldNv=(!NVH.hidden&&NVH.firstElementChild)?NVH:(NVSNAP&&performance.now()-NVSNAP.t<200?NVSNAP.el:null);
  NVSNAP=null;
  let ghost=null;
  try{
    if(oldNv){ghost=oldNv.cloneNode(true);ghost.hidden=false;ghost.className="pg-ghost";ghost.id="nv";}
    else{const r=A.getBoundingClientRect();ghost=document.createElement("div");ghost.className="pg-ghost";ghost.style.cssText=`left:${r.left}px;top:${Math.max(r.top,0)}px;width:${r.width}px;height:${Math.min(innerHeight,r.height)}px`;const c=A.cloneNode(true);c.removeAttribute("id");c.style.margin="0";ghost.appendChild(c)}
    ghost.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    ghost.querySelectorAll("*").forEach(e=>{e.style.animation="none"});
    document.body.appendChild(ghost);
  }catch(_){ghost=null}
  NVH.style.animation="none";
  const res=fn.apply(self,args);
  const toNv=!NVH.hidden&&NVH.firstElementChild;
  const tgt=toNv?NVH.firstElementChild:A;
  const o={duration:260,easing:"cubic-bezier(.3,0,.2,1)",fill:"backwards"};
  if(ghost){
    if(toNv&&oldNv){ghost.style.cssText="position:fixed;inset:0;z-index:199;pointer-events:none;animation:none";}
    else if(toNv){ghost.remove();ghost=null}
    else{ghost.style.zIndex="300"}
  }
  tgt.animate(toNv?[{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}]:[{transform:"translateY(10px)"},{transform:"none"}],o);
  if(ghost){
    const fade=!(toNv&&oldNv);
    if(fade){const a=ghost.animate([{opacity:1},{opacity:0}],{duration:220,easing:"ease-out",fill:"forwards"});a.onfinish=()=>ghost.remove()}
    else setTimeout(()=>ghost.remove(),300);
    setTimeout(()=>ghost&&ghost.remove(),700)
  }
  return res;
}
Object.keys(PAGE_RANK).forEach(n=>{const f=window[n];if(typeof f!=="function")return;
  window[n]=function(...a){if(n==="home"&&a[0])return f.apply(this,a);return slidePage(n,f,a,this)}});


/* ==== Préchargement de toutes les images ==== */
(()=>{
  const set=new Set((document.scripts[document.scripts.length-1].textContent.match(/https:\/\/image\.noelshack\.com\/[^"'`\s)\\]+/g)||[]));
  const add=u=>{if(typeof u==="string"&&/^https?:/.test(u))set.add(u)};
  try{Object.values(BUS_META).forEach(m=>add(m.img));NV_BRANDS.forEach(x=>add(x[2]));NV_LINE_ORDER.forEach(c=>LINE_TILE[c]&&add(NVI+LINE_TILE[c].i));Object.values(IMG).forEach(f=>add(N+f));Object.values(BUS_IMG).forEach(add);Object.values(ARR).forEach(add);[COCHE,RER,BUSIMG,RERIMG].forEach(add)}catch(_){}
  const urls=[...set],tot=urls.length||1;let n=0,fin=false;
  window.__imgs=[];
  const bar=document.getElementById("pre-b"),pre=document.getElementById("pre"),txt=document.getElementById("pre-t");

  setTimeout(done,10000);
})();

/* ==== Protection anti-inspection (dissuasive : un navigateur reçoit toujours le code) ==== */
(()=>{
  if(!PROD)return;
  let done=false;
  const kill=()=>{if(done)return;done=true;try{document.documentElement.innerHTML='<body style="margin:0;background:#0e1628;color:#fff;font:600 18px system-ui;display:grid;place-items:center;height:100vh;text-align:center;padding:24px">Outils de développement détectés.<br>Fermez-les puis rechargez la page.</body>'}catch(_){}};
  const key=e=>{const k=(e.key||"").toLowerCase(),c=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||k==="f12"||(c&&e.shiftKey&&["i","j","c","k"].includes(k))||(c&&["u","s","p"].includes(k))||(e.metaKey&&e.altKey&&["i","j","c","u"].includes(k))){e.preventDefault();e.stopPropagation();return false}};
  addEventListener("keydown",key,true);addEventListener("keyup",key,true);
  addEventListener("contextmenu",e=>e.preventDefault(),true);
  addEventListener("copy",e=>{if(!/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||""))e.preventDefault()});
  addEventListener("dragstart",e=>e.preventDefault(),true);
  const probe=()=>{
    const t=performance.now();(function(){debugger})();if(performance.now()-t>120)return kill();
    const el=new Image();let hit=false;Object.defineProperty(el,"id",{get(){hit=true;return""}});console.debug(el);if(hit)kill();
  };
  setInterval(probe,1500);
  document.querySelectorAll("img").forEach(i=>i.setAttribute("draggable","false"));
  try{console.log=console.info=console.warn=()=>{}}catch(_){}
})();

/* ==== Tutoriel de première utilisation (une seule fois par appareil) ==== */
;(()=>{
  const K="reg_tour_";
  const got=id=>{try{return!!localStorage.getItem(K+id)}catch(_){return true}};
  const remember=id=>{try{localStorage.setItem(K+id,"1")}catch(_){}};
  const q=x=>typeof x==="function"?x():(x?document.querySelector(x):null);
  let cur=null;
  const busy=()=>!!document.getElementById("pre")||!!document.querySelector(".ovl")||!!cur;
  function run(id,steps){
    if(cur||got(id))return;
    remember(id);
    let i=0,raf=0,first=true;
    const root=document.createElement("div");root.id="tr";
    root.innerHTML='<div class="tr-hole"></div><div class="tr-card" role="dialog" aria-live="polite"><small class="tr-n"></small><h3 class="tr-t"></h3><p class="tr-p"></p><div class="tr-b"><button type="button" class="tr-skip">Passer</button><button type="button" class="tr-prev">Précédent</button><button type="button" class="tr-next"></button></div></div>';
    document.body.appendChild(root);
    const $q=c=>root.querySelector(c),hole=$q(".tr-hole"),card=$q(".tr-card"),n=$q(".tr-n"),t=$q(".tr-t"),p=$q(".tr-p"),prev=$q(".tr-prev"),next=$q(".tr-next");
    const show=()=>{
      const s=steps[i];
      n.textContent=(i+1)+" / "+steps.length;t.textContent=s.t;p.textContent=s.p;
      prev.hidden=i===0;next.textContent=i===steps.length-1?"Terminer":"Suivant";
      const el=q(s.el);if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"});
    };
    const place=()=>{
      const s=steps[i],el=q(s.el),vw=innerWidth,vh=innerHeight,pad=s.pad==null?6:s.pad;
      let r=el?el.getBoundingClientRect():null;
      if(r&&(r.width<2||r.height<2||r.bottom<0||r.top>vh))r=null;
      root.classList.toggle("nohole",!r);
      const cw=card.offsetWidth,ch=card.offsetHeight;
      let cx,cy;
      if(r){
        const x=Math.max(0,r.left-pad),y=Math.max(0,r.top-pad),w=Math.min(vw,r.right+pad)-x,h=Math.min(vh,r.bottom+pad)-y;
        hole.style.cssText="left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px";
        if(vh-(y+h)>=ch+20)cy=y+h+12;
        else if(y>=ch+20)cy=y-ch-12;
        else{
          cy=Math.max(12,Math.min(vh-ch-12,y+h/2-ch/2));
          if(x+w+12+cw<=vw-8)cx=x+w+12;
          else if(x-cw-12>=8)cx=x-cw-12;
          else cy=vh-ch-12;
        }
        if(cx==null)cx=Math.max(12,Math.min(vw-cw-12,x+w/2-cw/2));
      }else{
        hole.style.cssText="left:"+vw/2+"px;top:"+vh/2+"px;width:0;height:0";
        cx=(vw-cw)/2;cy=(vh-ch)/2;
      }
      card.style.left=Math.round(cx)+"px";card.style.top=Math.round(cy)+"px";
    };
    const loop=()=>{place();if(first){first=false;requestAnimationFrame(()=>root.classList.add("go"))}raf=requestAnimationFrame(loop)};
    const end=()=>{cancelAnimationFrame(raf);removeEventListener("keydown",key,true);root.remove();cur=null};
    const go=d=>{const j=i+d;if(j<0)return;if(j>=steps.length)return end();i=j;show()};
    const key=e=>{
      e.stopPropagation();
      if(e.key==="Escape"){e.preventDefault();end()}
      else if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();go(1)}
      else if(e.key==="ArrowLeft"){e.preventDefault();go(-1)}
    };
    addEventListener("keydown",key,true);
    $q(".tr-skip").onclick=end;prev.onclick=()=>go(-1);next.onclick=()=>go(1);
    cur={end};show();loop();
  }

  const HOME=[
    {t:"Bienvenue sur Régulation Bus",p:"Ce site t’accompagne pendant ton service : horaires, arrêts, écart avec l’horaire théorique et consignes. Voici un tour rapide, il ne s’affichera qu’une seule fois."},
    {el:"#hc",t:"L’horloge",p:"Elle sert de référence pour tous les horaires du site."},
    {el:"#hdr nav",t:"Départs et Fiches",p:"« Départs » liste les lignes en service avec leur prochain départ. « Fiches » prépare ton service : tes véhicules, tes lignes préférées et le nombre de courses."},
    {el:".rowx .row",t:"Une ligne, un sens",p:"Chaque tuile indique l’indice de la ligne, son terminus et le temps avant le prochain départ. Touche-la pour choisir ton arrêt de départ, puis ta destination."},
    {el:".rowx .more",t:"Partiel libre",p:"Ce bouton permet de ne faire qu’une partie de la ligne, en choisissant toi-même l’arrêt de départ et l’arrêt d’arrivée."},
    {t:"À toi de jouer",p:"Choisis une ligne pour lancer la régulation. Un second tour rapide t’expliquera l’écran de régulation."}
  ];
  const REG=[
    {el:".nv3-l",pad:4,t:"Prochain arrêt",p:"Le nom et l’heure théorique du prochain arrêt. En dessous, les arrêts suivants : la liste remonte à chaque arrêt validé."},
    {el:".nv3-nav",t:"Valider un arrêt",p:"Touche « Arrêt suivant » quand le bus quitte l’arrêt. « Arrêt précédent » corrige une erreur."},
    {el:".nv3-dlt",t:"Écart horaire",p:"Règle ton avance ou ton retard avec +5, +1, -1 et -5 minutes : les heures de passage s’ajustent."},
    {el:".nv3-cons",pad:4,t:"Consignes de régulation",p:"Les consignes automatiques (attendre, limiter les arrêts…) et celles envoyées pour ta ligne s’affichent ici."},
    {el:()=>{const e=document.querySelector("#ar1n");return e&&e.closest(".nv3-c")},pad:4,t:"Arrivée",p:"Le terminus et le temps estimé avant d’y arriver, mis à jour selon ton écart."},
    {el:".nv3-r",pad:4,t:"Discussions",p:"Échange avec les autres régulateurs de la même ligne."},
    {el:"#nvc",t:"Heure de départ",p:"Touche l’horloge pour régler l’heure de départ de ton service."},
    {el:"#nv-home",t:"Retour à l’accueil",p:"Ce bouton te ramène à l’accueil. Le bouton avec l’indice de ligne te ramène à l’écran précédent."}
  ];

  /* accueil : dès que le chargement est fini et que les lignes sont affichées */
  let tries=0;
  const wait=setInterval(()=>{
    if(got("home")||++tries>100)return clearInterval(wait);
    if(busy()||!NVH.hidden||!document.querySelector(".rowx"))return;
    clearInterval(wait);setTimeout(()=>{if(!busy()&&NVH.hidden)run("home",HOME)},500);
  },300);

  /* écran de régulation : la première fois qu'il s'ouvre */
  const v0=window.view;
  window.view=function(...a){
    const r=v0.apply(this,a);
    if(!got("reg"))setTimeout(()=>{if(!NVH.hidden&&document.querySelector(".nv3-l")&&!busy())run("reg",REG)},1100);
    return r;
  };
})();
