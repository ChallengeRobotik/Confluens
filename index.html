@font-face{font-family:Parisine;src:url(Parisine-Regular.otf) format("opentype");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-Bold.otf) format("opentype");font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-Italic.otf) format("opentype");font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:Parisine;src:url(Parisine-BoldItalic.otf) format("opentype");font-weight:700;font-style:italic;font-display:swap}



:root{--bg:#031a24;--bg2:#06303d;--teal:#0b6f86;--lc:#0b6f86;--y:#faeb14;--w:#fff;--ok:#5be3a0;--late:#ff6b5e;--m:rgba(255,255,255,.68)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Parisine,"Trebuchet MS",system-ui,sans-serif;color:var(--w);background:#021218;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(90deg,transparent 0 7px,#7ff 7px 8px);animation:rain 6s linear infinite}
@keyframes rain{to{background-position:0 400px}}
main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:clamp(16px,4vw,40px)}
.tag{font-size:clamp(16px,2.6vw,26px);font-weight:400}
h1{font-size:clamp(54px,13vw,150px);line-height:.95;color:var(--y);font-weight:700;letter-spacing:-.02em;margin-bottom:.25em}
.v{animation:in .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}


.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-items:stretch}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px;height:100%;min-height:215px;padding:16px;line-height:1.3;border-radius:18px;color:var(--w);font:inherit;text-align:left;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;animation:in .5s both;position:relative;overflow:hidden}
.chip:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--lc,var(--y))}
.chip img.lg,.chip > img:first-child{flex:none;height:46px;width:auto;max-width:100%;margin:0;object-fit:contain;object-position:left center}
.chip small{flex:1 1 auto;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.88);overflow-wrap:anywhere}
.chip .nd{flex:none;font-size:13px;font-weight:700;color:var(--w);line-height:1.3}
.chip .nd em{display:block;font-style:normal;font-weight:400;color:var(--m);font-size:12px}
.chip .badge{flex:none;margin-top:auto;white-space:normal;border-radius:14px;font-size:12.5px;line-height:1.35}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chip{min-height:200px;padding:14px}}


.arr{display:inline-block;height:.82em;width:auto;vertical-align:-.08em;object-fit:contain;pointer-events:none}
.arr-dbl{display:inline;height:1.05em;max-height:18px;width:auto;vertical-align:-.18em;margin:0 5px;object-fit:contain;pointer-events:none}
.btn .arr{height:.9em;margin:0 4px}
.btn-idl{height:24px;width:auto;object-fit:contain;border-radius:4px;vertical-align:middle;pointer-events:none}


.top{display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top .lg{height:48px;width:auto;border-radius:8px;display:block}
.top .btn{height:48px;display:inline-flex;align-items:center;gap:8px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--y);color:#021;transition:transform .15s,opacity .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn.g{background:rgba(255,255,255,.12);color:var(--w)}
.btn.g:hover{background:rgba(255,255,255,.22)}
.btn.g.on{background:var(--y);color:#021}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.sheet-go{background:rgba(255,255,255,.14);color:var(--w);border:1px solid rgba(255,255,255,.24)}
.btn.sheet-go:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.45)}


.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{border-radius:26px;padding:clamp(18px,3vw,28px)}
.lab{color:var(--m);font-style:italic;font-size:15px}
.dest{font-size:clamp(22px,4vw,36px);font-weight:700;margin:4px 0 14px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.next{font-size:clamp(32px,6.5vw,66px);font-weight:700;color:var(--y);line-height:1.08;min-height:2em;animation:in .45s both}
.rm{margin:6px 0 0;font-size:14px;color:var(--m);font-variant-numeric:tabular-nums;min-height:1.4em}


.bar{height:9px;background:rgba(255,255,255,.14);border-radius:9px;margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lc,var(--y));border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--lc,var(--y))}


.list{list-style:none;padding:0;margin:4px 0 0;position:relative}
.list li{position:relative;padding:11px 0 11px 42px;font-size:clamp(16px,2.4vw,20px);animation:in .5s both;opacity:.92;background:linear-gradient(var(--lc,var(--teal)),var(--lc,var(--teal))) 8px 0/4px 100% no-repeat}
.list li:first-child{background-size:4px 50%;background-position:8px 100%;font-weight:700;opacity:1}
.list li:last-child{background-size:4px 50%;background-position:8px 0}
.list li:only-child{background:none}
.list li:before{content:"";box-sizing:border-box;position:absolute;left:0;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--lc,#000);box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.list li.t:before{border-color:var(--lc,var(--y));box-shadow:0 0 0 3px var(--y),0 0 12px var(--lc,var(--y))}
.tm{float:right;color:var(--m);font-size:14px;font-variant-numeric:tabular-nums;margin-left:12px}


.nx{display:flex;align-items:center;gap:.35em}
.dot{flex:none;width:.68em;height:.68em;border-radius:50%;background:#fff;border:.15em solid var(--lc,#000);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 16px var(--lc,transparent);animation:pop .5s both}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}


.delta{text-align:center;display:flex;flex-direction:column;justify-content:center}
.num{font-size:clamp(64px,14vw,120px);font-weight:700;line-height:1;transition:color .4s;font-variant-numeric:tabular-nums;margin:8px 0}
.st{font-size:20px;font-weight:700;letter-spacing:.06em;transition:color .4s}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ctl .btn{min-width:62px;font-size:24px}
.act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.act .btn{flex:1 1 210px;font-size:18px;padding:15px 18px}


.dcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0}
.dc{font:inherit;color:var(--w);text-align:left;cursor:pointer;border-radius:22px;padding:clamp(18px,3vw,30px);transition:transform .2s,border-color .2s,background .2s;animation:in .5s both;position:relative;overflow:hidden}
.dc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc,var(--y))}
.dc b{display:flex;align-items:center;gap:10px;color:var(--y);font-size:clamp(24px,4.5vw,42px);line-height:1.15;margin:6px 0 10px}


.sel-wrap{position:relative;display:block;width:100%}
.sel-wrap:after{content:"";position:absolute;right:16px;top:50%;width:16px;height:16px;margin-top:-8px;background:url("https://image.noelshack.com/fichiers/2026/47/5/1795191436-fleche-ratp-bas-blanche.png") center/contain no-repeat;pointer-events:none;opacity:.85}
select{font:inherit;width:100%;padding:14px 44px 14px 16px;border-radius:14px;background-color:#052631 !important;color:#fff !important;border:1px solid rgba(255,255,255,.28);appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;color-scheme:dark}
select:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 2px rgba(250,235,20,.25)}
select option{background-color:#052631 !important;color:#fff !important;padding:10px}
select optgroup{background-color:#031820 !important;color:var(--y) !important;font-style:normal;font-weight:700}

.dep{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.dep .lab{font-size:14px}
.dep input[type="time"]{font:inherit;width:auto;padding:10px 14px;border-radius:12px;background-color:#052631 !important;color:#fff !important;border:1px solid rgba(255,255,255,.28);color-scheme:dark}
.dep input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
.dep .btn{padding:10px 14px;font-size:14px}

.badge{display:inline-block;background:rgba(250,235,20,.16);border:1px solid rgba(250,235,20,.35);color:var(--y);padding:3px 11px;border-radius:99px;font-size:13.5px;font-weight:700}
.empty{padding:32px;text-align:center;line-height:1.6}
.empty b{color:var(--y)}


.f-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);cursor:pointer;font-size:14.5px;font-weight:700;line-height:1.25;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;position:relative;overflow:hidden}
.chk:hover{transform:translateY(-2px);background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border-color:rgba(255,255,255,.4)}
.chk:has(input:checked){border-color:var(--y);box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 0 0 1px rgba(250,235,20,.35);background:linear-gradient(145deg,rgba(250,235,20,.14),rgba(255,255,255,.05))}
.chk input{accent-color:var(--y);width:18px;height:18px;flex:none;cursor:pointer}
.chk .bus-ph{flex:none;height:34px;width:auto;max-width:96px;object-fit:contain}
.bus-ph.big{display:block;height:64px;width:auto;max-width:100%;object-fit:contain;margin-top:8px}
.hint{color:var(--m);margin:6px 0 0;font-size:16px;line-height:1.4;max-width:560px}
.steps{display:flex;gap:8px;margin:14px 0 6px}.steps i{width:34px;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}.steps i.on{background:var(--y)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.bcard{position:relative;display:block;padding:0;margin:0;border:3px solid rgba(255,255,255,.22);border-radius:18px;overflow:hidden;background:rgba(3,26,36,.6);cursor:pointer;font:inherit;color:#fff;text-align:left;transition:transform .15s,border-color .15s}
.bcard:hover{transform:translateY(-2px)}
.bcard .bimg{display:block;width:100%;height:auto;margin:0;padding:0}
.bcard .bn{display:block;padding:8px 12px;font-weight:700;font-size:14.5px;background:rgba(0,0,0,.4)}
.bcard .tick{position:absolute;top:0;right:0;width:30px;height:30px;display:none;align-items:center;justify-content:center;background:var(--y);color:#021;font-weight:900;border-bottom-left-radius:14px}
.bcard.on{border-color:var(--y)}.bcard.on .tick{display:flex}
.bcard .gr{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;color:#021;background:var(--ok);padding:2px 8px;border-radius:8px}
.bcard.free{cursor:default}.bcard.free:hover{transform:none}
.chk.free{border-style:dashed;border-color:rgba(91,227,160,.45)}
.chk .tag-free{margin-left:auto;font-size:11px;color:var(--ok);font-weight:700;letter-spacing:.04em;white-space:nowrap}

.line-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:15px 16px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);cursor:pointer;font:inherit;color:var(--w);text-align:left;transition:transform .18s,border-color .18s,background .18s;position:relative;overflow:hidden}
.lcard:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--lc)}
.lcard:hover{transform:translateY(-2px);border-color:var(--lc)}
.lcard.on{border-color:var(--y);box-shadow:0 8px 24px rgba(0,0,0,.32),inset 0 0 0 1px rgba(250,235,20,.35);background:linear-gradient(145deg,rgba(250,235,20,.14),rgba(255,255,255,.06))}
.lcard img.l-ico{height:38px;width:auto;object-fit:contain}
.lcard .term-v{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.3;color:rgba(255,255,255,.88)}
.lcard .term-v span{display:block}
.lcard .term-v .sep-v{color:var(--m);font-size:11px}

.f-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.f-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.f-launch-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}


.f-sheet{display:grid;grid-template-columns:36px 1fr;gap:0 16px;align-items:start;position:relative}
.f-rail{position:relative;width:36px;min-height:100%}
.f-rail-line{position:absolute;left:50%;width:4px;margin-left:-2px;background:repeating-linear-gradient(to bottom,#fff 0 8px,transparent 8px 15px);z-index:0}
.f-node{position:absolute;left:50%;width:24px;height:24px;margin-left:-12px;margin-top:-12px;border-radius:50%;border:5px solid #fff;background:#021218;box-shadow:0 0 0 2px #fff;z-index:1}

.f-blocks{display:flex;flex-direction:column;gap:14px}


.f-card{border-radius:22px;padding:20px 22px 20px 26px;position:relative;overflow:hidden;animation:in .45s both}
.f-card.walk{background:linear-gradient(135deg,rgba(235,240,245,.22),rgba(210,220,230,.10))}
.f-card.hlp{background:linear-gradient(135deg,rgba(235,240,245,.22),rgba(210,220,230,.10))}
.f-card.hlp:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc,var(--y))}
.f-card.run{background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05))}
.f-card.run:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc,var(--y))}
.f-card.brk{background:rgba(250,235,20,.08);border-color:rgba(250,235,20,.35)}

.f-row{display:flex;align-items:center;gap:14px}
.f-ico{height:42px;width:auto;max-width:56px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.f-title{font-size:clamp(20px,3.2vw,28px);font-weight:700;line-height:1.15}
.f-sub{font-size:clamp(16px,2.5vw,22px);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}


.f-route{position:relative;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.f-route:before{content:"";position:absolute;left:6px;top:9px;bottom:9px;width:4px;border-radius:2px;background:var(--lc,var(--y))}
.f-pt{position:relative;display:flex;align-items:center;gap:14px;font-size:17px;font-weight:700;z-index:1}
.f-pt span.o{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #04212b;box-shadow:0 0 0 1.5px rgba(255,255,255,.65);flex:none}
.f-line-tag{position:relative;display:flex;align-items:center;gap:10px;padding-left:30px;font-size:15px;z-index:1}
.f-line-tag img.hlp-lg{height:30px;width:auto;object-fit:contain;border-radius:5px;flex:none}

.f-endpoints{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;font-size:14px}
.f-endpoints b{display:block;color:var(--m);font-weight:400;font-style:italic;font-size:12.5px}


.part-box{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:12px}
@media(max-width:700px){.part-box{grid-template-columns:1fr}}


body:before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(38% 38% at 20% 30%,rgba(11,150,180,.75),transparent 70%),radial-gradient(30% 30% at 80% 18%,rgba(250,235,20,.24),transparent 70%),radial-gradient(42% 42% at 72% 80%,rgba(0,180,140,.55),transparent 70%),radial-gradient(34% 34% at 14% 86%,rgba(40,90,220,.5),transparent 70%);filter:blur(28px);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(5%,-4%) rotate(10deg) scale(1.18)}100%{transform:translate(-5%,4%) rotate(-8deg) scale(1.05)}}
.card,.chip,.dc,.btn.g,.f-card{background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.26);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.chip:hover,.chip:focus-visible,.dc:hover,.dc:focus-visible{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.09));border-color:var(--lc,var(--y));box-shadow:0 14px 40px rgba(0,0,0,.4),0 0 0 1px var(--lc,var(--y)),inset 0 1px 0 rgba(255,255,255,.45);transform:translateY(-4px);outline:0}
@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}}


:root{--navy:#1b3a78;--ink:#1d4496;--blue:#1e5bd6;--led:#ff8a00;--y:#1b3a78;--m:#6b7390;--ok:#0a8a4a;--late:#d6281c;--p1:#f2f4f8;--p2:#d9dde5;--bf:brightness(0) invert(17%) sepia(95%) saturate(3500%) hue-rotate(215deg)}

#hdr{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:#17274a;border-bottom:1px solid rgba(255,255,255,.08)}
#hdr .hi{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:10px clamp(16px,4vw,40px)}

.sec{margin:28px 0 12px}

.card,.dc,.f-card,.f-card.walk,.f-card.hlp,.f-card.run,.lcard,.chk,.bcard{background:#dde4ef;color:var(--ink);border:0;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.25);-webkit-backdrop-filter:none;backdrop-filter:none}
.f-card.brk{background:linear-gradient(180deg,#fff0d6,#ffdca8);color:#7a3d00;border:0}
.lab{color:var(--m)}
.badge{background:#cfd8e7;border:0;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.dest,.next,.dc b,.f-title,.f-sub,.f-pt,.lcard .term-v,.bcard .bn{color:var(--ink);background:none}
.bar{background:rgba(0,38,107,.16)}
.f-node{background:var(--navy);border-color:#fff}
.f-endpoints{border-top-color:rgba(0,38,107,.18)}.f-endpoints b{color:var(--m)}

.lcard.on,.bcard.on,.chk:has(input:checked){outline:3px solid var(--led);outline-offset:2px}
.bcard{border:0}
.arr,.arr-dbl{filter:var(--bf)}
.btn:not(.g) .arr,.btn:not(.g) .arr-dbl,#hdr .arr{filter:none}
.rer{height:1.05em;width:auto;max-width:3.4em;object-fit:contain;flex:none;vertical-align:-.14em;margin-left:.3em;filter:var(--bf)}


.btn{background:#2458c4;color:#fff;border-radius:12px;box-shadow:none}
.btn:hover{background:#2f66d8}
.btn.g,.btn.sheet-go{background:#dde4ef;color:var(--ink);border:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn.g.on{background:#2458c4;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.dep input[type=time]{background-color:#eef1f7!important;color:var(--ink)!important;border:1px solid #b9c2d8;color-scheme:light}

.bd{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:10px;align-items:stretch}
.pop .rowx{animation:in .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
.row{flex:1;min-width:0;display:flex;align-items:stretch;min-height:86px;padding:0;overflow:hidden;font:inherit;text-align:left;cursor:pointer;border:0;border-radius:14px;background:#dde4ef;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
button.row:hover{transform:translateY(-1px);background:#e8edf5}
button.row:active{transform:scale(.99)}
.row.off{cursor:default}
.lb{flex:0 0 128px;width:128px;display:flex;align-items:center;justify-content:center;padding:0;font-size:clamp(38px,8vw,56px);font-weight:700;letter-spacing:-.02em;background:var(--lc)}
.dn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 18px;color:var(--ink);font-weight:700;font-size:clamp(18px,3.8vw,30px);line-height:1.1}
.tb{display:grid;grid-template-columns:repeat(2,92px);gap:8px;align-items:center;padding:0 14px 0 6px}
.tb b{height:48px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#000;color:var(--led);font-size:26px;font-variant-numeric:tabular-nums}
.mn:not(.clk):after{content:"min";font-size:.5em;margin-left:3px}
.tb b.end{grid-column:1/-1;font-size:22px;padding:0 16px}
.more{flex:none;width:58px;display:grid;place-items:center;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:background .2s,transform .2s}
.more:hover{background:rgba(255,255,255,.22)}


.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;margin:16px 0 18px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.seg button{font:inherit;color:#fff;background:transparent;border:0;border-radius:15px;padding:12px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .2s,color .2s,box-shadow .2s}
.seg button small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.seg button b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:clamp(15px,3.4vw,21px);line-height:1.15}
.seg .arr{filter:none}.seg .rer{filter:brightness(0) invert(1)}
.seg button.on{background:#dde4ef;color:var(--ink)}
.seg button.on .arr,.seg button.on .rer{filter:var(--bf)}
.pl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:18px;align-items:start}
.srch{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:#eef1f7;box-shadow:inset 0 0 0 1px #c5cde0;color:var(--m)}
.srch:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:13px 0}
.rl{list-style:none;margin:12px 0 0;padding:0}
.rl li{position:relative}
.rl li:before,.rl li:after{content:"";position:absolute;left:21px;width:6px;margin-left:-3px;top:0;bottom:0;background:var(--lc)}
.rl li:before{opacity:.25}
.rl li:first-child:before{top:50%}.rl li:last-child:before{bottom:50%}
.rl li:after{opacity:0;transition:opacity .25s;pointer-events:none}
.rl li.lit:after,.rl li.a:after,.rl li.b:after{opacity:1}
.rl li.a:after{top:50%}.rl li.b:after{bottom:50%}
.rl button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 10px 6px 0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:14px;transition:background .15s,opacity .2s}

.pin{flex:none;width:42px;display:grid;place-items:center}
.pin i{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--lc);box-shadow:0 0 0 2px rgba(0,38,107,.18);display:grid;place-items:center;font:700 15px/1 Parisine,system-ui,sans-serif;font-style:normal;color:#fff;transition:all .2s}
.rl li.lit .pin i{border-color:var(--navy)}
.rl li.a .pin i,.rl li.b .pin i{width:34px;height:34px;border:0;background:var(--navy);box-shadow:0 0 0 3px var(--led)}
.rl li.a .pin i:after{content:"A"}.rl li.b .pin i:after{content:"B"}
.rl li.dflt .pin i{opacity:.6}
.rl li.out button{opacity:.5}
.rl .nm{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-weight:700;font-size:clamp(16px,3.2vw,19px);line-height:1.2}
.rl li.a .nm:after,.rl li.b .nm:after{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff;background:var(--navy)}
.rl li.a .nm:after{content:"Départ"}
.rl li.b .nm:after{content:"Arrivée";background:var(--led);color:#000}
.rl li.dflt .nm:after{content:"Terminus"}
.sum{position:sticky;top:98px;display:flex;flex-direction:column;gap:14px}
.route{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:#eef1f7;box-shadow:inset 0 0 0 1px #d0d6e6}
.pt{display:flex;align-items:center;gap:12px;min-width:0;font-weight:700;font-size:clamp(17px,3.6vw,21px);line-height:1.15}
.pt em{font-style:normal;font-weight:400;color:var(--m);font-size:.8em;margin-left:6px}
.pn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:14px;font-style:normal;font-weight:700}

.ck small{white-space:nowrap;font-size:11px;font-weight:400;color:#aaa}
.sum .act{margin:0}.sum .act .btn{flex:1 1 100%;font-size:18px;padding:16px}
.two{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.two .btn{padding:10px 8px;font-size:14px}

  .more{width:42px}.rowx{gap:6px}
}

function pickDepotForLine(lineCode){
  const stops=DATA[lineCode].s.flat().map(x=>x.toLowerCase());
  const matchB=DEPOTS.berthee.keywords.some(kw=>stops.some(st=>st.includes(kw)));
  const matchC=DEPOTS.courcelles.keywords.some(kw=>stops.some(st=>st.includes(kw)));
  if(matchB&&!matchC)return "berthee";
  if(matchC&&!matchB)return "courcelles";
  return Math.random()<0.65?"berthee":"courcelles";
}

const BUS18=["Solaris Urbino 18 GNV","Volvo 7800E"];
function pickBus(lineCodes){
  const pool=[...fState.selectedPaid,...FREE_BUSES];
  const heavy=lineCodes.some(l=>l==="257"||l==="135");
  const w=pool.map(b=>BUS18.includes(b)?(heavy?3:0.5):1);
  let r=Math.random()*w.reduce((x,y)=>x+y,0);
  for(let k=0;k<pool.length;k++){r-=w[k];if(r<=0)return pool[k]}
  return pool[0];
}

function pickLinesForSheet(count,prefs){
  const all=Object.keys(DATA);
  const chosen=[];
  const validPrefs=prefs.filter(l=>DATA[l]);
  const shuffledPrefs=[...validPrefs].sort(()=>Math.random()-.5);
  for(const l of shuffledPrefs){
    if(chosen.length<count&&!chosen.includes(l))chosen.push(l);
  }
  const rest=all.filter(l=>!chosen.includes(l)).sort(()=>Math.random()-.5);
  for(const l of rest){
    if(chosen.length<count)chosen.push(l);
  }
  return chosen;
}
function canonStop(t){const n=normS(t);
  if(n.includes("chaillot batignolles rer"))return"chaillot";
  if(n.includes("rosenberg"))return"rosenberg";
  if(n==="gare de narberale")return"narberale";
  if(n.includes("narberale rer")&&!n.includes("pont"))return"narberale";
  if(n.includes("cramain universite")&&!n.includes("republique")&&!n.includes("berthelot"))return"cramain";
  if(n.includes("boulevard national")&&n.includes("mac mahon"))return"macmahon";
  if(n.includes("federation"))return"federation";
  if(n.includes("la vallee"))return"vallee";
  return n}
const DEPOT_HLP={
  berthee:{vallee:3,macmahon:5,federation:6,narberale:5,cramain:8,chaillot:15},
  courcelles:{chaillot:4}
};
const DEPOT_START=new Set([...Object.keys(DEPOT_HLP.berthee),...Object.keys(DEPOT_HLP.courcelles)]);
let NODES=null;
function lineNodes(){
  if(NODES)return NODES;NODES=[];
  for(const L in DATA)for(const d of [0,1]){
    const st=DATA[L].s[d],seen=new Set();
    for(const c of DATA[L].C[d]){const key=c.o+"-"+c.e;if(seen.has(key))continue;seen.add(key);
      NODES.push({L,d,a:c.o,b:c.e,from:canonStop(st[c.o]),to:canonStop(st[c.e])})}}
  return NODES}
const MAX_WAIT=20;
function legEnd(n,cur,first){
  const hl=first?(DEPOT_HLP[n.from==="chaillot"?"courcelles":"berthee"][n.from]||5):4;
  const p=nextExact(n.L,n.d,n.a,n.b,cur+hl*MIN);
  if(!p)return{wait:Infinity,end:cur,dep:cur,hl};
  return{wait:(p.ts-cur)/MIN-hl,dep:p.ts,end:p.base+p.c.t[n.b]*MIN,hl}}
function buildChain(count,prefs,mw=MAX_WAIT){
  const nodes=lineNodes();
  const run=rep=>{let best=[],bs=-1;
    for(let t=0;t<500;t++){
      const ch=[];let cur=null,ts=nowRound();
      while(ch.length<count){
        const c=nodes.filter(n=>(cur===null?DEPOT_START.has(n.from):n.from===cur)&&(rep||!ch.some(x=>x.L===n.L))&&legEnd(n,ts,cur===null).wait<=mw);
        if(!c.length)break;
        const w=c.map(n=>(prefs.includes(n.L)?5:1)*(0.3+Math.random()));
        let r=Math.random()*w.reduce((x,y)=>x+y,0),k=0;while(k<c.length-1&&(r-=w[k])>0)k++;
        ts=legEnd(c[k],ts,cur===null).end;ch.push(c[k]);cur=c[k].to}
      const sc=ch.length*100+ch.filter(n=>prefs.includes(n.L)).length*10+Math.random();
      if(sc>bs){bs=sc;best=ch}}
    return best};
  let best=run(false);if(best.length<count){const b2=run(true);if(b2.length>best.length)best=b2}
  return best}

function generateDaySheet(){
  const count=Math.min(5,Math.max(1,+fState.lineCount||1));
  let chain=[];
  for(const mw of [MAX_WAIT,60,180,600,Infinity]){chain=buildChain(count,fState.prefLines||[],mw);if(chain.length)break}
  const assignedLines=chain.map(n=>n.L);
  const bus=pickBus(assignedLines);
  const startKey=chain[0].from;
  const depotKey=startKey==="chaillot"?"courcelles":"berthee";
  const firstDepot=DEPOTS[depotKey];
  const hlpMin=DEPOT_HLP[depotKey][startKey]||5;
  let curTs=nowRound();
  const segments=[{type:"walk",bus,depot:firstDepot.name,startTime:fmt(curTs)}];
  chain.forEach((n,idx)=>{
    const lCode=n.L,dirIdx=n.d,d=DATA[lCode],st=d.s[dirIdx];
    const originStop=st[n.a],destStop=st[n.b];
    const leg=legEnd(n,curTs,idx===0);
    const matchedDep=leg.dep;
    if(idx===0){
      segments.push({type:"hlp",line:lCode,color:d.c,depot:firstDepot.name,to:originStop,vers:destStop,mins:hlpMin,depTime:fmt(matchedDep-hlpMin*MIN),arrTime:fmt(matchedDep)});
    }else{
      segments.push({type:"break",line:lCode,color:d.c,at:originStop,startTime:fmt(curTs),endTime:fmt(matchedDep),mins:Math.max(1,Math.round((matchedDep-curTs)/MIN))});
    }
    const arrTs=leg.end;
    segments.push({type:"run",line:lCode,color:d.c,dirIdx,startIdx:n.a,endIdx:n.b,depTs:matchedDep,from:originStop,to:destStop,startTime:fmt(matchedDep),endTime:fmt(arrTs),mins:Math.max(1,Math.round((arrTs-matchedDep)/MIN))});
    curTs=arrTs;
  });
  fState.generated={v:3,createdAt:Date.now(),bus,depot:firstDepot,lineCount:chain.length,lines:assignedLines,segments};
  saveFState();
}

    $("#f-next").onclick=()=>{fStep=2;fichesMenu()};
    return;
  }
  const allCodes=Object.keys(DATA);
  A.innerHTML=`<div class="top"><button type="button" class="btn g" id="f-back">${ic("g")} Mes bus</button></div>
  <div class="v"><h1 style="font-size:clamp(34px,7vw,70px)">mes lignes</h1>
  <p class="hint">Combien de lignes veux-tu faire aujourd’hui, et lesquelles te tentent ? Le reste est tiré au sort.</p>${dots}</div>
  <div class="card v" style="margin-bottom:16px">
    <div class="lab" style="margin-bottom:10px">Nombre de lignes (1 à 5)</div>
    <div class="ctl" style="justify-content:flex-start;margin-top:0;margin-bottom:18px">${[1,2,3,4,5].map(n=>`<button type="button" class="btn g ${fState.lineCount===n?"on":""}" data-cnt="${n}" style="min-width:52px;font-size:18px">${n}</button>`).join("")}</div>
    <div class="line-cards" id="pref-cards">${allCodes.map(c=>{const active=(fState.prefLines||[]).includes(c);
      return `<button type="button" class="lcard ${active?"on":""}" data-l="${c}" style="--lc:${DATA[c].c}">${img(c,"l-ico")}<div class="term-v"><span>${DATA[c].s[0][0]}</span><span class="sep-v">${ic("bas")}</span><span>${DATA[c].s[0].at(-1)}</span></div></button>`}).join("")}</div>
  </div>
  <div class="act" style="margin-top:0"><button type="button" class="btn" id="gen-sheet">Générer ma fiche de service ${ic("d")}</button></div>`;
  $("#f-back").onclick=()=>{fStep=1;fichesMenu()};
  A.querySelectorAll("[data-cnt]").forEach(btn=>btn.onclick=()=>{fState.lineCount=+btn.dataset.cnt;saveFState();fichesMenu()});
  A.querySelectorAll("#pref-cards .lcard").forEach(card=>card.onclick=()=>{const l=card.dataset.l;
    if(!Array.isArray(fState.prefLines))fState.prefLines=[];
    fState.prefLines=fState.prefLines.includes(l)?fState.prefLines.filter(x=>x!==l):[...fState.prefLines,l];saveFState();card.classList.toggle("on")});
  $("#gen-sheet").onclick=()=>{generateDaySheet();renderSheetView()};
}

function launchLineRegulation(seg){
  if(!seg||!DATA[seg.line])return;
  line=seg.line;
  dl=0;
  const dIdx=+(seg.dirIdx||0);
  const maxIdx=DATA[line].s[dIdx].length-1;
  let aIdx=Math.min(maxIdx,Math.max(0,+(seg.startIdx||0)));
  let eIdx=Math.min(maxIdx,Math.max(aIdx,+(seg.endIdx??maxIdx)));
  go(dIdx,aIdx,eIdx,seg.depTs||null);
}

function alignRailToCards(){
  const sheet=$("#f-sheet-wrap");
  const rail=$("#f-rail");
  if(!sheet||!rail)return;
  const cards=[...sheet.querySelectorAll(".f-card")];
  const nodes=[...rail.querySelectorAll(".f-node")];
  const lineEl=rail.querySelector(".f-rail-line");
  if(!cards.length||nodes.length!==cards.length)return;
  const railRect=rail.getBoundingClientRect();
  const centers=cards.map(c=>{
    const r=c.getBoundingClientRect();
    return (r.top-railRect.top)+(r.height/2);
  });
  nodes.forEach((n,idx)=>{n.style.top=`${centers[idx]}px`});
  if(lineEl&&centers.length){
    const firstY=centers[0];
    const lastY=centers[centers.length-1];
    lineEl.style.top=`${firstY}px`;
    lineEl.style.height=`${Math.max(0,lastY-firstY)}px`;
  }
}

function renderSheetView(){
  const g=fState.generated;
  if(!g){fichesMenu();return;}
  setLineTheme(g.lines[0]||null);

  const runSegments=g.segments.filter(s=>s.type==="run");
  const launchButtonsHtml=runSegments.map((s,idx)=>`<button type="button" class="btn sheet-go sm" data-run-idx="${idx}">Commencer la ligne ${img(s.line,"btn-idl")} ${ic("d")}</button>`).join("");

  const nodesHtml=g.segments.map((_,idx)=>`<div class="f-node" data-n-idx="${idx}"></div>`).join("");

  const cardsHtml=g.segments.map((seg,idx)=>{
    if(seg.type==="walk"){
      return `<div class="f-card walk" style="animation-delay:${idx*50}ms">
        <div class="f-row">
          <img class="f-ico" src="${ARR.walk}" alt="À pied">
          <div>
            <div class="f-title">Marcher vers le véhicule</div>
            <div class="f-sub">${ic("d")} <span>${seg.bus}</span></div>
          </div>
        </div>
      </div>`;
    }
    if(seg.type==="hlp"){
      return `<div class="f-card hlp" style="animation-delay:${idx*50}ms;--lc:${seg.color}">
        <div class="f-row">
          <img class="f-ico" src="${ARR.bus}" alt="Bus">
          <div>
            <div class="f-title">Haut-le-pied</div>
            <div class="f-sub">${ic("d")} <span>${seg.to}</span></div>
          </div>
        </div>
        <div class="f-route" style="--lc:${seg.color}">
          <div class="f-pt"><span class="o"></span><span>${seg.depot}</span><small class="tm">${seg.depTime}</small></div>
          <div class="f-line-tag" style="--lc:${seg.color}">${img(seg.line,"hlp-lg")} <em>vers</em> <strong>${seg.vers}</strong></div>
          <div class="f-pt"><span class="o"></span><span>${seg.to} · ${seg.mins} min.</span><small class="tm">${seg.arrTime}</small></div>
        </div>
      </div>`;
    }
    if(seg.type==="break"){
      return `<div class="f-card brk" style="animation-delay:${idx*50}ms;--lc:${seg.color}">
        <div class="f-row">
          <div>
            <div class="f-title">Pause · ${seg.mins} min</div>
            <div class="lab" style="margin-top:4px">${seg.at} · ${seg.startTime} → ${seg.endTime}</div>
          </div>
        </div>
      </div>`;
    }
    const rIdx=runSegments.indexOf(seg);
    return `<div class="f-card run" style="animation-delay:${idx*50}ms;--lc:${seg.color}">
      <div class="f-row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div class="f-row" style="gap:12px">
          ${img(seg.line,"f-ico")}
          <div class="f-title">${sn(seg.from)} ${ic("d")} ${sn(seg.to)}</div>
        </div>
        <div class="f-row" style="gap:8px;flex-wrap:wrap">
          <span class="badge">${seg.startTime} → ${seg.endTime}</span>
          <button type="button" class="btn sm sheet-go" data-direct-run="${rIdx}">Commencer la ligne ${img(seg.line,"btn-idl")} ${ic("d")}</button>
        </div>
      </div>
      <div class="f-endpoints">
        <div><b>Point de départ</b>${seg.from} (${seg.startTime})</div>
        <div><b>Point d’arrivée</b>${seg.to} (${seg.endTime})</div>
      </div>
    </div>`;
  }).join("");

  A.innerHTML=`<div id="f-view">
    <div class="top">
      <button type="button" class="btn g" id="f-retour">${ic("g")} Retour</button>
      <button type="button" class="btn" id="f-reset-zero">Refaire de zéro ${ic("dbl","arr-dbl")}</button>
    </div>
    <div class="v"><h1 style="font-size:clamp(36px,7.5vw,78px)">ma journée</h1></div>

    <div class="card" style="margin-bottom:18px">
      <div class="f-head">
        <div>
          <div class="lab">Véhicule assigné</div>
          <div style="font-size:24px;font-weight:700;color:var(--y)">${g.bus}</div>
        </div>
        <div class="f-meta">
          <span class="badge">${g.depot.name}</span>
          <span class="badge">${g.lineCount} ligne${g.lineCount>1?"s":""}</span>
        </div>
      </div>
      <div class="f-launch-bar">${launchButtonsHtml}</div>
    </div>

    <div class="f-sheet" id="f-sheet-wrap">
      <div class="f-rail" id="f-rail"><div class="f-rail-line"></div>${nodesHtml}</div>
      <div class="f-blocks">${cardsHtml}</div>
    </div>
  </div>`;

  requestAnimationFrame(()=>{alignRailToCards();setTimeout(alignRailToCards,120)});
  window.addEventListener("resize",alignRailToCards,{passive:true});

  $("#f-retour").onclick=()=>{
    fState.generated=null;
    saveFState();
    fichesMenu();
  };
  $("#f-reset-zero").onclick=()=>{
    fState.generated=null;
    fState.prefLines=[];
    saveFState();
    fichesMenu();
  };
  const fView=$("#f-view");
  fView.addEventListener("click",e=>{
    const btn=e.target.closest("[data-run-idx],[data-direct-run]");
    if(!btn)return;
    const rIdx=+(btn.dataset.runIdx??btn.dataset.directRun);
    const targetSeg=runSegments[rIdx];
    if(targetSeg)launchLineRegulation(targetSeg);
  });
}

let tab="d";
function mark(){document.querySelectorAll("#hdr nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));clock()}
document.querySelectorAll("#hdr nav button").forEach(b=>b.onclick=()=>{if(line!=null&&dir!==null)leave();line=null;dir=null;b.dataset.t==="f"?fichesMenu():home()});
home();
</script></body></html>
