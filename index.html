/* Grille accueil */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-items:stretch}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px;height:100%;min-height:215px;padding:16px;line-height:1.3;border-radius:18px;color:var(--w);font:inherit;text-align:left;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;animation:in .5s both;position:relative;overflow:hidden}
.chip:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--lc,var(--y))}
.chip img{flex:none;height:46px;width:auto;max-width:100%;margin:0;object-fit:contain;object-position:left center}
.chip small{flex:1 1 auto;font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.88);overflow-wrap:anywhere}
.chip .nd{flex:none;font-size:13px;font-weight:700;color:var(--w);line-height:1.3}
.chip .nd em{display:block;font-style:normal;font-weight:400;color:var(--m);font-size:12px}
.chip .badge{flex:none;margin-top:auto;white-space:normal;border-radius:14px;font-size:12.5px;line-height:1.35}

.arr{display:inline-block;height:.82em;width:auto;vertical-align:-.08em;object-fit:contain;pointer-events:none}
.arr-dbl{display:inline-block;font-size:0.9em;vertical-align:baseline;margin:0 0.25em;font-weight:700;color:var(--y)}
.btn .arr{height:.9em;margin:0 4px}
.dc b .arr{height:0.8em;vertical-align:baseline;position:relative;top:-0.05em;}

/* Navigation & Boutons */
.top{display:flex;justify-content:flex-start;align-items:center;gap:14px;margin-bottom:14px}
.top .lg{height:48px;width:auto;border-radius:8px;display:block}
.top .btn{height:48px;display:inline-flex;align-items:center;gap:8px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--y);color:#021;transition:transform .15s,opacity .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn.g{background:rgba(255,255,255,.12);color:var(--w)}
.btn.g:hover{background:rgba(255,255,255,.22)}
.btn.g.on{background:var(--y);color:#021}

/* Colonnes & Cartes */
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{border-radius:26px;padding:clamp(18px,3vw,28px)}
.lab{color:var(--m);font-style:italic;font-size:15px}
.dest{font-size:clamp(22px,4vw,36px);font-weight:700;margin:4px 0 14px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.next{font-size:clamp(32px,6.5vw,66px);font-weight:700;color:var(--y);line-height:1.08;min-height:2em;animation:in .45s both}
.rm{margin:6px 0 0;font-size:14px;color:var(--m);font-variant-numeric:tabular-nums;min-height:1.4em}

.bar{height:9px;background:rgba(255,255,255,.14);border-radius:9px;margin:16px 0;overflow:hidden}

.act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

function build(m,x){
  const ex=new Set(x.split("|")),a=m.split("|"),
  f=l=>l.map(s=>s.replace(/^[\^~]/,"")).filter(s=>!ex.has(s));
  return[f(a.filter(s=>s[0]!="~")),f(a.filter(s=>s[0]!="^")).reverse()];
}

const STOP_MIN=1,LAYOVER=4;

function buildDayDeps(n,dIdx=0){
  const sc=(SCHED[n]&&SCHED[n][dIdx])||{first:360,last:1320,bands:[[360,1320,15]]};
  const out=[sc.first];
  let cur=sc.first;
  while(cur<sc.last){
    const b=sc.bands.find(([a,z])=>cur>=a&&cur<z)||sc.bands.at(-1);
    cur+=b[2];
    if(cur<=sc.last)out.push(cur);
  }
  return out;
}

function slot(n,dIdx=0,now=new Date()){
  const sc=(SCHED[n]&&SCHED[n][dIdx])||{first:360,last:1320,bands:[[360,1320,15]]};
  const m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const b=new Date(now);b.setHours(0,0,0,0);
  let t=m;
  if(sc.last>1440&&m<sc.last-1440){t=m+1440;b.setDate(b.getDate()-1)}
  if(t<sc.first-15||t>sc.last)return null;
  const deps=buildDayDeps(n,dIdx);
  const nxt=deps.find(dm=>dm>=t-1e-6);
  return nxt!=null?b.getTime()+nxt*60000:null;
}

function nextStart(){
  let best=null;const b=new Date();b.setHours(0,0,0,0);
  for(const n in DATA){
    const sc=(SCHED[n]&&SCHED[n][0])||{first:360};
    for(let k=0;k<2;k++){
      const ts=b.getTime()+k*864e5+sc.first*60000;
      if(ts>Date.now()&&(!best||ts<best.ts))best={ts,n};
    }
  }
  return best;
}

const dur=ms=>{const a=Math.abs(Math.round(ms/1000)),m=Math.floor(a/60),r=a%60;return m?`${m} min ${String(r).padStart(2,"0")} s`:`${r} s`};
const nowRound=()=>Math.ceil(Date.now()/60000)*60000;
let dep=0,lastSig="";
const schedTs=k=>dep+k*STOP_MIN*60000;

function setLineTheme(n){
  const col=n&&DATA[n]?DATA[n].c:"#0b6f86";

function tick(){
  document.querySelectorAll(".nd[data-ts]").forEach(e=>{
    const d=+e.dataset.ts-Date.now();

  });
  const r=$("#rm");if(!r||line==null||dir===null)return;
  const ts=schedTs(i)+dl*60000,d=ts-Date.now();
  r.textContent=`${i?"Arrivée":"Départ"} prévu ${fmt(ts)} · ${d>=0?"dans "+dur(d):"dépassé de "+dur(d)}`;
}

function home(refresh){
  const act=Object.entries(DATA).map(([n,d])=>[n,d,slot(n,0)||slot(n,1)]).filter(x=>x[2]);
  const sig=act.map(x=>x[0]+x[2]).join();
  if(refresh&&sig===lastSig)return;
  lastSig=sig;line=null;dir=null;setLineTheme(null);
  let body;
  if(act.length){
    body=`<div class="grid">${act.map(([n,d,ts],k)=>`<button class="chip" style="animation-delay:${k*45}ms;--lc:${d.c}" data-l="${n}">${img(n,"")}<small>${d.s[0].at(-1)}${ic("dbl","arr-dbl")}${d.s[1].at(-1)}</small><span class="nd" data-ts="${ts}">Départ ${fmt(ts)}<em></em></span><span class="badge">${d.j}</span></button>`).join("")}</div>`;

    const nx=nextStart();
    body=`<div class="card empty">Aucune ligne en service pour le moment.${nx?`<br>Prochain service : <b>${nx.n}</b> à <b>${new Date(nx.ts).toLocaleString("fr-FR",{weekday:"long",hour:"2-digit",minute:"2-digit"})}</b>.`:""}</div>`;

}

}

function go(k,e){
  dir=k;end=e;i=0;

}

function flip(){
  const k=1-dir;
  const calcNext=schedTs(R().length-1)+LAYOVER*60000;
  const nextSlot=slot(line,k,new Date(calcNext-60000));
  dep=nextSlot&&nextSlot>=calcNext?nextSlot:calcNext;
  dir=k;end=DATA[line].s[k].length-1;i=0;
  view();push();
}

    dep=t;upd();push();
  };
  $("#dn").onclick=()=>{dep=slot(line,dir)||nowRound();dp.value=fmt(dep);upd();push()};
  upd();
}

function next(){if(line==null||dir===null)return;if(i<R().length-1){i++;upd();push()}else flip()}
function prev(){if(line==null||dir===null)return;if(i>0){i--;upd();push()}}
function ecart(v){dl+=v;upd();push()}

function upd(){
  const s=R(),last=s.length-1,n=$("#nx");
  n.style.animation="none";n.offsetWidth;n.style.animation="";n.textContent=s[i];
  $("#lb").textContent=i==last?"Terminus":i==0?"Départ":"Prochain arrêt";

  $("#adv").innerHTML=i<last?`Arrêt suivant ${ic("d")}`:`Terminus · changer de sens ${ic("dbl","arr-dbl")}`;

  tick();
}
