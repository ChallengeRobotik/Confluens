<header><button class="bt" id="bk" data-a="back" style="display:none">←</button><h1 id="ht">Serveurs privés</h1><span class="sp"></span><button class="bt" id="sn" data-a="snd"></button></header>

<script>
const DB="https://confluens-default-rtdb.europe-west1.firebasedatabase.app";
const WEBHOOK_URL="";          /* ← même webhook Discord que index.html (format {content}) */

const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jg=p=>fetch(`${DB}/${p}.json`).then(r=>r.json()),js=(m,p,b)=>fetch(`${DB}/${p}.json`,{method:m,body:b===undefined?undefined:JSON.stringify(b)});
const okRes=async res=>{if(!res.ok)return false;try{const d=await res.clone().json();return!(d&&d.error)}catch{return true}};
const uid=localStorage.sse_uid||(localStorage.sse_uid=Math.random().toString(36).slice(2,14));
const rnd=n=>[...Array(n)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join(""),mkCode=()=>"SSE-"+rnd(4)+"-"+rnd(4)+"-"+rnd(4);

const rich=t=>{const s0=String(t??""),S_=typeof S!=="undefined"?S:null,ix=!(S_&&S_.d&&S_.d.meta&&S_.d.meta.ix===0),m={};

const ks=Object.keys(m).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")),
parts=["RER",...ks],
re=parts.length?new RegExp("(?<![\\wÀ-ÿ])("+parts.join("|")+")(?![\\wÀ-ÿ])","gi"):null;

return esc.replace(re,x=>{const u=x.toUpperCase();if(u==="RER")return RER_IMG?`<img src="${RER_IMG}" alt="RER" style="height:1em;vertical-align:-.15em">`:'<i class="rer">RER</i>';const l=m[u];return l?`<span class="ib${l.dg?" d":""}" style="--c:${E(l.c||"#2458c4")};--k:${ink(l.c||"#2458c4")}"><b>${E(l.n)}</b></span>`:x})};

const md=h=>{const m=$("#md");m.innerHTML=h?`<div class="mb">${h}</div>`:"";m.style.display=h?"grid":"none"};
/* ---------- lignes de référence (lues dans index.html : une seule source de vérité) ---------- */
async function loadBase(){try{const h=await(await fetch("index.html")).text();T=JSON.parse(h.match(/^const TT=(\{.*\});\s*$/m)[1]);[...h.match(/const LINE_COLOR=\{([^}]*)\}/)[1].matchAll(/"(\w+)":"(#\w{6})"/g)].forEach(x=>LC[x[1]]=x[2])}catch(e){}}
const seed=()=>Object.fromEntries(Object.keys(T).map((n,i)=>["l"+i,{n,c:LC[n]||"#0b6f86",dg:/^(N76|135)$/.test(n)?1:0,b:n,st:"ok",o:i,cad:0,pt:["",""]}]));

const bd=l=>`<span class="bd${l.dg?" d":""}" style="--c:${E(l.c||"#2458c4")};--k:${ink(l.c||"#2458c4")}"><b>${rer(E(l.n))}</b></span>`;

const tm=(l,k)=>(l.pt&&l.pt[k])||stp(l)[k].at(-1)||"—",isPt=(l,k)=>l.pt&&l.pt[k]&&l.pt[k]!==stp(l)[k].at(-1);
const LS=()=>Object.entries(S?.d?.lines||{}).filter(([,l])=>l&&l.n).map(([id,l])=>({id,...l})).sort((a,b)=>(a.o??99)-(b.o??99)||String(a.n).localeCompare(String(b.n)));
const lb=id=>LS().find(l=>l.id===id);
const rl=()=>S.d.meta.owner===uid?2:(S.d.members?.[uid]?.r?1:0),isOwn=()=>rl()===2,isReg=()=>rl()>=1;
const log=x=>js("POST",`prive/${S.id}/log`,{t:Date.now(),u:me.n,x});

/* ---------- écran d'accueil « Prochains départs » (même rendu et mêmes horaires qu'index.html) ---------- */
const GAME_OFFSET=36e5,MIN=6e4,HORIZON=120*MIN,gnow=()=>Date.now()+GAME_OFFSET;
const dayMid=o=>{const b=new Date(gnow());b.setHours(0,0,0,0);b.setDate(b.getDate()+o);return b.getTime()};
const decC=(r,len)=>{const t=new Array(len).fill(null);let a=r[0],x=r[1];t[a]=x;for(let k=2;k<r.length;k++){x+=r[k];t[a+k-1]=x}return{o:a,e:a+r.length-2,t}};
const CC={};
const courses=(b,k)=>{const key=b+"|"+k;if(CC[key])return CC[key];const d=T[b]&&T[b][k];if(!d)return null;return CC[key]=d.c.map(r=>decC(r,d.s.length))};
const fmtT=ts=>new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function deps(l,k,c=2){const now=gnow(),o=[],cs=l.b&&!l.s?courses(l.b,k):null;
if(cs){const s=stp(l)[k],e=l.pt&&l.pt[k]?s.indexOf(l.pt[k]):-1;
for(let i=-1;i<=2;i++){const base=dayMid(i);for(const x of cs){if(x.t[0]==null||(e>0&&x.t[e]==null))continue;const ts=base+x.t[0]*MIN;if(ts>=now-3e4)o.push(ts)}}}
else if(l.cad>0){const q=l.cad*MIN;let t=Math.ceil(now/q)*q;for(let i=0;i<c;i++,t+=q)o.push(t)}
return o.sort((a,b)=>a-b).slice(0,c)}
const PLI='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="6" r="2.6"/><path d="M6 15.4V11a3 3 0 0 1 3-3h6.4"/></svg>';
const sn=s=>/ RER$/.test(s)?`<span class="sn">${E(s.replace(/ RER$/,""))}<img class="rerl" src="${RER_IMG}" alt="RER"></span>`:E(s);
let POP=false,LH="";
function lignesHome(bn){const R=[];let c=0;
LS().forEach(l=>{const s=stp(l);[0,1].forEach(k=>{if(!s[k].length)return;const q={l,k,i:c++,t:[],msg:"",int:0};
if(l.st==="int"){q.msg="ligne interrompue";q.int=1}
else{q.t=deps(l,k).filter(ts=>ts-gnow()<=HORIZON);if(!q.t.length)q.msg=(l.b&&!l.s)||l.cad>0?"service terminé":"pas d’horaire"}
R.push(q)})});
const on=R.filter(r=>r.t.length),all=[...on,...R.filter(r=>!r.t.length)];
let nx=null;if(!on.length)R.forEach(r=>{if(r.int)return;const t=deps(r.l,r.k,1)[0];if(t!=null&&(!nx||t<nx.ts))nx={ts:t,n:r.l.n}});
const seen={},row=r=>{const{l,k}=r,off=!r.t.length,tg=off?"div":"button",at=off?"":` data-a="take" data-id="${l.id}" data-k="${k}"`,
box=off?`<b class="end">${r.msg}</b>`:r.t.map(ts=>`<b class="mn" data-ts="${ts}"></b>`).join(""),
mo=isReg()||!off?`data-a="${isReg()?"edl":"take"}" data-id="${l.id}" data-k="${k}"`:"disabled",
dp=l.dep&&Date.now()-l.dep<9e5,ev=[...(seen[l.id]?[]:bn.filter(b=>b.l===l.id).map(b=>b.x)),...(!seen[l.id]&&dp?["Départ ordonné à "+hm(l.dep)]:[])];seen[l.id]=1;
return`<div class="rowx${off?" off":""}" style="--i:${r.i}"><${tg} class="drow${off?" off":""}"${at} style="--lc:${E(l.c||"#2458c4")}"><span class="lb${isPt(l,k)?" tri":""}" style="color:${ink(l.c||"#2458c4")}">${E(l.n)}</span><span class="dn">${sn(tm(l,k))}</span><span class="tb">${box}</span></${tg}><button class="more" ${mo} title="${isReg()?"Modifier la ligne":"Prendre la ligne"}" aria-label="${isReg()?"Modifier la ligne":"Prendre la ligne"}">${PLI}</button></div>`+ev.map(x=>`<div class="ev evx">${rich(x)}</div>`).join("")};
return`<div class="hero${POP?" v":""}"><h2>${on.length?"Prochains départs":all.length?"Plus de départ pour le moment":"Aucune ligne."}</h2>${nx?`<p class="hint">Reprise du service à <b>${fmtT(nx.ts)}</b> · ligne <b>${E(nx.n)}</b>.</p>`:""}</div>`+(all.length?`<div class="bdx${POP?" pop":""}">${all.map(row).join("")}</div>`:"")}
function tickMn(){const now=gnow();document.querySelectorAll(".mn[data-ts]").forEach(e=>{const ts=+e.dataset.ts,d=ts-now,c=d>=36e5;e.classList.toggle("clk",c);e.textContent=c?fmtT(ts):Math.max(0,Math.floor(d/6e4))})}

/* ---------- accueil ---------- */

m.innerHTML=`<div class="card"><h2>Créer un serveur</h2><input id="cn" maxlength="30" placeholder="Nom du serveur"><label><input id="cp" type="checkbox">Serveur public (visible par tous dans la liste)</label><br><button class="pb" data-a="cr">Créer</button></div>

<div class="card"><h2>Serveurs publics</h2><div id="pl">Chargement…</div></div>`;pubLoad()}
async function pubLoad(){const e=$("#pl");try{const p=await jg("prive_pub");if(!e)return;
if(p&&p.error)return e.textContent="Liste indisponible : accès refusé par la base de données (règles Firebase).";

/* ---------- entrée dans un serveur ---------- */
async function enter(id){const b=await jg(`prive/${id}/ban/${uid}`);if(b===1||b>Date.now())return tt("Accès refusé : vous êtes exclu de ce serveur.");
const n=localStorage["sse_n_"+id];if(!n)return md(`<h2>Choisis ton pseudo</h2><p>Il sera propre à ce serveur.</p><input id="nk" maxlength="20" placeholder="Pseudo"><button class="pb" data-a="nk" data-id="${id}">Entrer</button>`);
me={n};S={id,d:null};tab="l";clearInterval(PT);PT=setInterval(poll,3000);poll()}
async function joinCode(code){code=code.trim().toUpperCase();if(!/^SSE(-[A-Z0-9]{4}){3}$/.test(code))return tt("Code invalide.");
const c=await jg("prive_codes/"+code);if(!c)return tt("Code inconnu ou révoqué.");
const known=await jg(`prive/${c.id}/members/${uid}`);if(!known){if(c.max&&(c.used||0)>=c.max)return tt("Ce lien a atteint sa limite d’utilisations.");js("PATCH","prive_codes/"+code,{used:(c.used||0)+1})}
history.replaceState(null,"",location.pathname);enter(c.id)}
function leaveSrv(m){if(S)js("PATCH",`prive/${S.id}/members/${uid}`,{l:""});me={};home();if(m)tt(m)}
/* ---------- synchro (REST + polling, comme index.html) ---------- */
async function poll(){if(!S)return;try{const d=await jg("prive/"+S.id);if(!d){js("DELETE","prive_pub/"+S.id);return leaveSrv("Ce serveur n’existe plus.")}
const b=(d.ban||{})[uid];if(b===1||b>Date.now())return leaveSrv("Vous avez été exclu du serveur.");
S.d=d;if(d.meta.owner===uid&&d.meta.pub&&!S.healed){S.healed=1;await js("PUT","prive_pub/"+S.id,{n:d.meta.name,c:d.meta.color||"#2458c4"})}js("PATCH",`prive/${S.id}/members/${uid}`,{n:me.n,t:Date.now(),l:me.l||"",dr:me.dr||0,i:me.i||0,dl:me.dl||0});checkPop();draw();if(tab==="c")chatLoad()}catch(e){}}
function tabsBar(){const t=[["l","Lignes"],["p","Présence"]];if(isReg())t.push(["r","Régulation"]);t.push(["c","Chat"]);if(isOwn())t.push(["g","Réglages"]);if(isOwn()||ADMIN_UIDS.includes(uid))t.push(["j","Journal"]);
return`<div class="tabs">${t.map(([k,n])=>`<button class="${tab===k?"on":""}" data-a="tab" data-k="${k}">${n}</button>`).join("")}</div>`}
function draw(f){if(!S)return;const d=S.d;if(!d)return;const m=$("#main");document.documentElement.style.setProperty("--tc",d.meta.color||"#2458c4");$("#ht").textContent=d.meta.name;$("#bk").style.display="";
$("#sn").textContent=localStorage.sse_snd==="0"?"Son : non":"Son : oui";
if(!f&&"crg".includes(tab)&&m.dataset.t===tab)return;const first=m.dataset.t!==tab;POP=first;const hh=tabsBar()+V[tab]();if(!f&&!first&&tab==="l"&&hh===LH)return;LH=hh;m.dataset.t=tab;m.innerHTML=hh;if(tab==="l"){document.querySelectorAll(".lb.tri").forEach(e=>e.style.animationDelay=-(Date.now()%2000)/1000+"s");tickMn()}if(tab==="c")chatLoad();if(tab==="g")qr()}
/* ---------- vues ---------- */
const V={};
V.l=()=>{const d=S.d,bn=Object.values(d.banners||{}),rel=Object.values(d.msgs||{}).filter(relv).slice(-3).reverse();let h="";
if(d.meta.pin)h+=`<div class="pin">Épinglé · ${rich(d.meta.pin)}</div>`;
bn.filter(b=>b.l==="all").forEach(b=>h+=`<div class="pin">${rich(b.x)}</div>`);
if(me.l&&lb(me.l)){const l=lb(me.l),s=stp(l)[me.dr]||[];h+=`<div class="my">${bd(l)}<div><b>→ ${E(tm(l,me.dr))}</b><div>${E(s[me.i]||"")}</div></div><div class="bs"><button class="sb" data-a="nx">Arrêt suivant</button><button class="sb" data-a="dl" data-v="-1">−</button><span>${me.dl>0?"+":""}${me.dl||0} min</span><button class="sb" data-a="dl" data-v="1">+</button><button class="sb" data-a="qt">Quitter</button></div></div>`}
if(rel.length)h+=`<div class="card"><h2>Consignes de régulation</h2>${rel.map(m=>`<div class="cm"><b>${hm(m.t)}</b> ${rich(m.x)}</div>`).join("")}</div>`;
if(isReg())h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="pb" data-a="edl" data-id="">+ Nouvelle ligne</button>${LS().length?`<button class="sb" data-a="dellines">Supprimer des lignes</button>`:""}</div>`;
return h+lignesHome(bn)};
V.p=()=>{const d=S.d,ms=Object.entries(d.members||{}).sort((a,b)=>b[1].t-a[1].t);
return`<div class="card"><h2>Présence</h2>${ms.map(([u,m])=>{const on=Date.now()-m.t<15000,l=m.l&&lb(m.l),s=l?(stp(l)[m.dr]||[])[m.i]:"",mod=u!==uid&&u!==d.meta.owner;
return`<div class="row"><i class="on-dot${on?" o":""}"></i><b>${E(m.n)}</b>${u===d.meta.owner?'<span class="tag">Créateur</span>':m.r?'<span class="tag">Régulateur</span>':""}${on&&l?`${bd(l)}<span>→ ${E(tm(l,m.dr))} · ${E(s||"")}</span><span class="${m.dl>0?"late":"ok"}">${m.dl>0?"+":""}${m.dl||0} min</span>`:`<span>${on?"En ligne":"Hors ligne"}</span>`}<span class="sp"></span>${u!==uid?`<button class="sb" data-a="dm" data-u="${u}">Chat privé</button>`:""}${mod&&isReg()?`<button class="sb" data-a="kick" data-u="${u}">Exclure 10 min</button>`:""}${mod&&isOwn()?`<button class="sb" data-a="ban" data-u="${u}">Bannir</button><button class="sb" data-a="role" data-u="${u}">${m.r?"Retirer régulateur":"Régulateur"}</button><button class="sb" data-a="own" data-u="${u}">Transférer</button>`:""}</div>`}).join("")}</div>`};
V.r=()=>{const d=S.d,on=Object.entries(d.members||{}).filter(([,m])=>Date.now()-m.t<15000),lo=LS().map(l=>`<option value="${l.id}">Ligne ${E(l.n)}</option>`).join("");
return`<div class="card"><h2>Message de régulation</h2><textarea id="rx" rows="3" maxlength="300" placeholder="Message affiché en pop-up"></textarea>
<label>Destinataires<select id="rt"><option value="all">Tout le serveur</option>${LS().map(l=>`<option value="l:${l.id}">Conducteurs de la ligne ${E(l.n)}</option>`).join("")}</select></label>
<details><summary>Ou choisir des personnes présentes</summary>${on.map(([u,m])=>`<label><input type="checkbox" class="pu" value="${u}">${E(m.n)}</label>`).join("")||"Personne en ligne."}</details><br><button class="pb" data-a="sm">Envoyer</button></div>
<div class="card"><h2>Bannière d’événement</h2><input id="bx" maxlength="120" placeholder="Travaux, grève…"><select id="bl"><option value="all">Tout le serveur</option>${lo}</select><button class="pb" data-a="sb">Publier</button>
${Object.entries(d.banners||{}).map(([k,b])=>`<div class="row"><span>${rich(b.x)}</span><span class="sp"></span><button class="sb" data-a="db" data-k="${k}">Retirer</button></div>`).join("")}</div>
<div class="card"><h2>Messages envoyés</h2>${Object.entries(d.msgs||{}).slice(-20).reverse().map(([k,m])=>`<div class="row"><span>${hm(m.t)} · ${E(m.f)} → ${E(tgn(m.tg))} : ${rich(m.x)}</span><span class="sp"></span><button class="sb" data-a="dmg" data-k="${k}">Supprimer</button></div>`).join("")}</div>`};
V.c=()=>{const d=S.d;return`<div class="card"><h2>Chat</h2><select id="cc" onchange="chan=this.value;chatLoad()"><option value="gen">Général</option>${Object.entries(d.members||{}).filter(([u])=>u!==uid).map(([u,m])=>`<option value="${dmk(u)}"${chan===dmk(u)?" selected":""}>Privé · ${E(m.n)}</option>`).join("")}</select><div id="cl"></div><input id="ci" maxlength="300" placeholder="Votre message" onkeydown="if(event.key==='Enter')A.cs()"><button class="pb" data-a="cs">Envoyer</button></div>`};
V.g=()=>{const m=S.d.meta,c=m.code,lk=location.origin+location.pathname+"#"+c,bn=Object.keys(S.d.ban||{}).filter(u=>S.d.ban[u]===1);
return`<div class="card"><h2>Paramètres</h2><label>Nom<input id="gn" maxlength="30" value="${E(m.name)}"></label><label>Couleur thématique<input id="gc" type="color" value="${m.color}"></label>
<label><input id="gp" type="checkbox"${m.pub?" checked":""}>Serveur public (visible dans la liste, accessible sans code)</label><br><label><input id="gi" type="checkbox"${m.ix===0?"":" checked"}>Afficher les numéros de ligne en indices (annonces, bannières, consignes, chat)</label><br><label>Message épinglé<input id="gm" maxlength="200" value="${E(m.pin||"")}"></label><button class="pb" data-a="sv">Enregistrer</button></div>
<div class="card"><h2>Invitation</h2><p><b>${c}</b></p><input readonly value="${lk}" onclick="this.select()"><label>Limite d’utilisations (0 = illimité)<input id="gx" type="number" min="0" value="${S.cd?.max||0}"></label>
<div class="bs"><button class="sb" data-a="cp">Copier le lien</button><button class="sb" data-a="gx">Appliquer la limite</button><button class="pb dg" data-a="rg">Révoquer et régénérer</button></div><div id="qr" style="margin-top:12px;background:#fff;display:inline-block;padding:8px"></div></div>
${bn.length?`<div class="card"><h2>Bannis</h2>${bn.map(u=>`<div class="row"><span>${E(S.d.members?.[u]?.n||u)}</span><span class="sp"></span><button class="sb" data-a="unban" data-u="${u}">Lever</button></div>`).join("")}</div>`:""}
<div class="card"><button class="pb dg" data-a="delsrv">Supprimer le serveur</button></div>`};
V.j=()=>`<div class="card"><h2>Journal d’activité</h2>${Object.values(S.d.log||{}).slice(-100).reverse().map(l=>`<div class="row"><b>${hm(l.t)}</b> ${E(l.u)} · ${E(l.x)}</div>`).join("")||"Rien à signaler."}</div>`;
const tgn=t=>t==="all"?"tous":t.startsWith("l:")?"ligne "+(lb(t.slice(2))?.n||"?"):"personnes ciblées",dmk=u=>"dm_"+[uid,u].sort().join("_");
const relv=m=>m.tg==="all"||m.tg==="l:"+me.l||(m.tg.startsWith("u:")&&m.tg.slice(2).split(",").includes(uid));
/* ---------- pop-up de régulation ---------- */
function beep(){if(localStorage.sse_snd==="0")return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
function checkPop(){const k="sse_s_"+S.id,seen=+localStorage[k]||Date.now();let mx=seen;Object.values(S.d.msgs||{}).forEach(m=>{if(m.t>seen){mx=Math.max(mx,m.t);if(relv(m))pq.push(m)}});localStorage[k]=mx;if(pq.length&&!$("#pp").classList.contains("s"))showPop()}
function showPop(){const m=pq.shift(),p=$("#pp"),l=me.l&&lb(me.l);p.style.setProperty("--c",l?l.c:"var(--tc)");$("#ppf").textContent="Régulation · "+m.f;$("#ppx").innerHTML=rich(m.x);$("#ppc").disabled=true;beep();p.classList.remove("s");void p.offsetWidth;p.classList.add("s");
setTimeout(()=>{$("#ppc").disabled=false;p.classList.remove("s");setTimeout(()=>{if(pq.length)showPop()},400)},3000)}
/* ---------- chat ---------- */
async function chatLoad(){const e=$("#cl");if(!e||!S)return;try{const r=await jg(`prive_chat/${S.id}/${chan}?orderBy="$key"&limitToLast=50`)||{},st=e.scrollTop+e.clientHeight>=e.scrollHeight-30;
e.innerHTML=Object.values(r).map(m=>`<div class="cm"><b>${E(m.n)}</b> <small>${hm(m.t)}</small><br>${rich(m.x)}</div>`).join("")||"Aucun message.";if(st)e.scrollTop=e.scrollHeight}catch(x){}}
function qr(){const e=$("#qr");if(e&&window.QRCode&&S.d.meta.code){e.innerHTML="";new QRCode(e,{text:location.origin+location.pathname+"#"+S.d.meta.code,width:160,height:160})}}
/* ---------- éditeur & suppression multiple de lignes ---------- */
function fillSt(){const l=cur,k=+$("#tdr").value;$("#tst").innerHTML=stp(l)[k].map((s,i)=>`<option value="${i}">${E(s)}</option>`).join("")}
function edl(id){const l=id?lb(id):{n:"",c:"#2458c4",dg:0,cad:0,st:"ok",pt:["",""],s:[[],[]]},s=stp(l);
md(`<h2>${id?"Modifier la ligne":"Nouvelle ligne"}</h2><label>Indice (1 à 4 caractères · « RER » = indice RER)<input id="en" maxlength="12" value="${E(l.n)}"></label>
<label>Couleur de fond<input id="ec" type="color" value="${l.c}"></label><label><input id="ed" type="checkbox"${l.dg?" checked":""}>Diagonale noire (façon N76 / 135)</label><br>
<label>Cadence (minutes, 0 = aucune)<input id="ek" type="number" min="0" value="${l.cad||0}"></label>
<label>État<select id="es"><option value="ok">En service</option><option value="int"${l.st==="int"?" selected":""}>Interrompue</option></select></label>
<label>Arrêts sens 1 (un par ligne)<textarea id="e0" rows="4">${E(s[0].join("\n"))}</textarea></label><label>Arrêts sens 2 (un par ligne)<textarea id="e1" rows="4">${E(s[1].join("\n"))}</textarea></label>
<datalist id="dl0">${s[0].map(x=>`<option value="${E(x)}">`).join("")}</datalist><datalist id="dl1">${s[1].map(x=>`<option value="${E(x)}">`).join("")}</datalist>
<label>Terminus partiel sens 1 (arrêt existant ou texte libre)<input id="p0" list="dl0" value="${E(l.pt?.[0]||"")}"></label><label>Terminus partiel sens 2<input id="p1" list="dl1" value="${E(l.pt?.[1]||"")}"></label>
<div class="bs"><button class="pb" data-a="esv" data-id="${id}">Enregistrer</button>${id?`<button class="sb" data-a="edp" data-id="${id}">Dupliquer</button><button class="sb" data-a="eor" data-id="${id}">Ordonner un départ</button><button class="pb dg" data-a="edel" data-id="${id}">Supprimer</button>`:""}<button class="sb" data-a="mc">Annuler</button></div>`)}
function delLinesModal(){const list=LS();
md(`<h2>Supprimer des lignes</h2><p>Coche les lignes à supprimer de ce serveur.</p>
<div style="display:flex;gap:8px;margin-bottom:8px"><button type="button" class="sb" data-a="selall" data-v="1">Tout cocher</button><button type="button" class="sb" data-a="selall" data-v="0">Tout décocher</button></div>
<div class="del-list">${list.map(l=>`<label class="del-item"><input type="checkbox" class="dlchk" value="${E(l.id)}">${bd(l)}<b>Ligne ${E(l.n)}</b><span style="margin-left:auto;font-size:13px;opacity:.75">${E(tm(l,0))}</span></label>`).join("")||"Aucune ligne."}</div>
<div class="bs"><button class="pb dg" data-a="dellines_go">Supprimer la sélection</button><button class="sb" data-a="mc">Annuler</button></div>`)}
/* ---------- actions ---------- */
const A={};
A.back=()=>leaveSrv();A.mc=()=>md();A.ppc=()=>{};
A.snd=()=>{localStorage.sse_snd=localStorage.sse_snd==="0"?"1":"0";$("#sn").textContent=localStorage.sse_snd==="0"?"Son : non":"Son : oui"};
A.tab=a=>{tab=a.k;draw(true)};
A.nk=a=>{const n=$("#nk").value.trim();if(!n)return;localStorage["sse_n_"+a.id]=n;md();enter(a.id)};
A.jn=()=>joinCode($("#jc").value);A.jp=a=>enter(a.id);
A.cr=async()=>{const name=$("#cn").value.trim();if(!name)return tt("Donne un nom au serveur.");await loadBase();const id=rnd(10),code=mkCode();
const pub=$("#cp")&&$("#cp").checked?1:0;const rSrv=await js("PUT","prive/"+id,{meta:{name,color:"#2458c4",pub,ix:1,pin:"",owner:uid,code},lines:seed()});
if(!await okRes(rSrv))return tt("Création refusée par la base de données (règles Firebase).");
await js("PUT","prive_codes/"+code,{id,max:0,used:0});
if(pub){const rPub=await js("PUT","prive_pub/"+id,{n:name,c:"#2458c4"});if(!await okRes(rPub))tt("Serveur créé, mais liste publique bloquée par les règles Firebase.")}
if(WEBHOOK_URL)fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:"Régulation Bus",content:`Nouveau serveur privé : ${name.replace(/[@`]/g,"")} (${code})`,allowed_mentions:{parse:[]}})}).catch(()=>{});
enter(id)};
A.take=a=>{cur=lb(a.id);md(`<h2>${bd(cur)}</h2><label>Sens<select id="tdr" onchange="fillSt()">${[0,1].map(k=>`<option value="${k}">→ ${E(tm(cur,k))}</option>`).join("")}</select></label><label>Arrêt actuel<select id="tst"></select></label><div class="bs"><button class="pb" data-a="go" data-id="${a.id}">Prendre la ligne</button><button class="sb" data-a="mc">Annuler</button></div>`);fillSt();if(a.k!==undefined){$("#tdr").value=a.k;fillSt()}};
A.go=a=>{me.l=a.id;me.dr=+$("#tdr").value;me.i=+$("#tst").value;me.dl=0;md();draw(true);poll()};
A.nx=()=>{const l=lb(me.l);me.i=Math.min((me.i||0)+1,stp(l)[me.dr].length-1);poll();draw(true)};
A.dl=a=>{me.dl=(me.dl||0)+ +a.v;draw(true);poll()};A.qt=()=>{me.l="";draw(true);poll()};
A.dm=a=>{chan=dmk(a.u);tab="c";draw(true)};
A.kick=async a=>{await js("PUT",`prive/${S.id}/ban/${a.u}`,Date.now()+6e5);log("a exclu "+S.d.members[a.u].n+" (10 min)");tt("Exclu pour 10 minutes.")};
A.ban=async a=>{if(!confirm("Bannir définitivement ?"))return;await js("PUT",`prive/${S.id}/ban/${a.u}`,1);log("a banni "+S.d.members[a.u].n)};
A.unban=async a=>{await js("DELETE",`prive/${S.id}/ban/${a.u}`);log("a levé le bannissement de "+(S.d.members[a.u]?.n||a.u));poll();setTimeout(()=>draw(true),500)};
A.role=async a=>{const m=S.d.members[a.u];await js("PATCH",`prive/${S.id}/members/${a.u}`,{r:m.r?"":1});log((m.r?"a retiré le rôle de régulateur à ":"a nommé régulateur ")+m.n)};
A.own=async a=>{if(!confirm("Transférer la propriété du serveur ?"))return;await js("PATCH",`prive/${S.id}/meta`,{owner:a.u});log("a transféré la propriété à "+S.d.members[a.u].n);tab="l";poll()};
A.sm=async()=>{const x=$("#rx").value.trim();if(!x)return;const u=[...document.querySelectorAll(".pu:checked")].map(e=>e.value),tg=u.length?"u:"+u.join(","):$("#rt").value;
await js("POST",`prive/${S.id}/msgs`,{t:Date.now(),f:me.n,x,tg});log("message de régulation → "+tgn(tg));poll();setTimeout(()=>draw(true),500)};
A.sb=async()=>{const x=$("#bx").value.trim();if(!x)return;await js("POST",`prive/${S.id}/banners`,{x,l:$("#bl").value});log("bannière publiée : "+x);poll();setTimeout(()=>draw(true),500)};
A.db=async a=>{await js("DELETE",`prive/${S.id}/banners/${a.k}`);poll();setTimeout(()=>draw(true),500)};
A.dmg=async a=>{await js("DELETE",`prive/${S.id}/msgs/${a.k}`);poll();setTimeout(()=>draw(true),500)};
A.cs=async()=>{const i=$("#ci"),x=i.value.trim();if(!x)return;i.value="";await js("POST",`prive_chat/${S.id}/${chan}`,{u:uid,n:me.n,x,t:Date.now()});chatLoad()};
A.sv=async()=>{const name=$("#gn").value.trim()||S.d.meta.name,pub=$("#gp").checked?1:0,color=$("#gc").value;const r1=await js("PATCH",`prive/${S.id}/meta`,{name,color,pub,ix:$("#gi").checked?1:0,pin:$("#gm").value.trim()});

const ok1=await okRes(r1),ok2=await okRes(r2);

A.cp=()=>navigator.clipboard?.writeText(location.origin+location.pathname+"#"+S.d.meta.code).then(()=>tt("Lien copié."));

A.edl=a=>edl(a.id);

await Promise.all(ids.map(id=>js("DELETE",`prive/${S.id}/lines/${id}`)));
if(me.l&&ids.includes(me.l))me.l="";
