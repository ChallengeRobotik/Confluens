<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- protection basique contre l'inspection ---------- */
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input,textarea"))e.preventDefault()});
document.addEventListener("keydown",e=>{
  const k=String(e.key||"").toLowerCase();
  if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["i","j","c","k"].includes(k))||(e.metaKey&&e.altKey&&["i","j","c"].includes(k))||(e.ctrlKey&&["u","s"].includes(k))){
    e.preventDefault();e.stopPropagation();return false;
  }
},true);

const DB="https://confluens-default-rtdb.europe-west1.firebasedatabase.app";
const WEBHOOK_URL="";
const RER_IMG="https://image.noelshack.com/fichiers/2026/48/1/1795444285-design-sans-titre.png";
const ADMIN_UIDS=[];
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jg=p=>fetch(`${DB}/${p}.json`).then(r=>r.json()),js=(m,p,b)=>fetch(`${DB}/${p}.json`,{method:m,body:b===undefined?undefined:JSON.stringify(b)});
const okRes=async res=>{if(!res.ok)return false;try{const d=await res.clone().json();return!(d&&d.error)}catch{return true}};
const uid=localStorage.sse_uid||(localStorage.sse_uid=Math.random().toString(36).slice(2,14));
const rnd=n=>[...Array(n)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join(""),mkCode=()=>"SSE-"+rnd(4)+"-"+rnd(4)+"-"+rnd(4);
const ink=h=>{const n=parseInt((h||"#2458c4").slice(1),16);return(((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150)?"#000":"#fff"};
const hm=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const rich=t=>{const s0=String(t??""),S_=typeof S!=="undefined"?S:null,ix=!(S_&&S_.d&&S_.d.meta&&S_.d.meta.ix===0),m={};
if(ix&&S_&&S_.d&&S_.d.lines)Object.values(S_.d.lines).forEach(l=>{if(l&&l.n&&!/RER/i.test(l.n))m[String(l.n).toUpperCase()]=l});
const ks=Object.keys(m).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")),
parts=["RER",...ks],
re=parts.length?new RegExp("(?<![\\wÀ-ÿ])("+parts.join("|")+")(?![\\wÀ-ÿ])","gi"):null;
const esc=E(s0);
if(!re)return esc;
return esc.replace(re,x=>{const u=x.toUpperCase();if(u==="RER")return RER_IMG?`<img src="${RER_IMG}" alt="RER" style="height:1em;vertical-align:-.15em">`:'<i class="rer">RER</i>';const l=m[u];return l?`<span class="ib${l.dg?" d":""}" style="--c:${E(l.c||"#2458c4")};--k:${ink(l.c||"#2458c4")}"><b>${E(l.n)}</b></span>`:x})};

let T={},LC={},S=null,tab="l",me={},PT,pq=[],chan="gen",cur=null;
const tt=m=>{const e=$("#tt");e.textContent=m;e.style.display="block";clearTimeout(tt._t);tt._t=setTimeout(()=>e.style.display="none",3000)};
const md=h=>{const m=$("#md");m.innerHTML=h?`<div class="mb">${h}</div>`:"";m.style.display=h?"grid":"none"};

/* ---------- pseudos uniques ---------- */
const normPseudo=s=>String(s||"").trim().replace(/\s+/g," ").toLowerCase();
function isPseudoTaken(name,membersObj,selfUid=uid){
  const target=normPseudo(name);
  if(!target)return false;
  return Object.entries(membersObj||{}).some(([u,m])=>{
    if(u===selfUid||!m||!m.n)return false;
    const active=(Date.now()-(m.t||0))<86400000;
    return active&&normPseudo(m.n)===target;
  });
}

/* ---------- lignes de référence (lues dans index.html) ---------- */
async function loadBase(){try{const h=await(await fetch("index.html")).text();T=JSON.parse(h.match(/^const TT=(\{.*\});\s*$/m)[1]);[...h.match(/const LINE_COLOR=\{([^}]*)\}/)[1].matchAll(/"(\w+)":"(#\w{6})"/g)].forEach(x=>LC[x[1]]=x[2])}catch(e){}}
const seed=()=>Object.fromEntries(Object.keys(T).map((n,i)=>["l"+i,{n,c:LC[n]||"#0b6f86",dg:/^(N76|135)$/.test(n)?1:0,b:n,st:"ok",o:i,cad:0,pt:["",""],pto:[0,0]}]));
const rer=t=>t.replace(/RER/g,RER_IMG?`<img src="${RER_IMG}" style="height:.8em">`:'<i class="rer">RER</i>');
const bd=l=>`<span class="bd${l.dg?" d":""}" style="--c:${E(l.c||"#2458c4")};--k:${ink(l.c||"#2458c4")}"><b>${rer(E(l.n))}</b></span>`;

/* ---------- arrêts, terminus partiels vs officiels ---------- */
const rawStp=l=>{const x=l.s||(T[l.b]||[]).map(d=>d.s);return[x[0]||[],x[1]||[]]};
const stp=l=>{const r=rawStp(l);return[0,1].map(k=>{const a=r[k],p=(l.pt&&l.pt[k]||"").trim();if(!p)return a;const idx=a.indexOf(p);if(idx>=0)return a.slice(0,idx+1);return a.length?[...a,p]:[p]})};
const tm=(l,k)=>((l.pt&&l.pt[k])||"").trim()||rawStp(l)[k].at(-1)||"—";
const isPt=(l,k)=>{const p=((l.pt&&l.pt[k])||"").trim(),last=rawStp(l)[k].at(-1);return!!(p&&p!==last&&!(l.pto&&l.pto[k]))};

const LS=()=>Object.entries(S?.d?.lines||{}).filter(([,l])=>l&&l.n).map(([id,l])=>({id,...l})).sort((a,b)=>(a.o??99)-(b.o??99)||String(a.n).localeCompare(String(b.n)));
const lb=id=>LS().find(l=>l.id===id);
const isAdmin=()=>ADMIN_UIDS.includes(uid);
const rl=()=>S.d.meta.owner===uid?2:(S.d.members?.[uid]?.r?1:0);
const isOwn=()=>rl()===2;
const isReg=()=>rl()>=1||isAdmin();
const canJson=()=>isOwn()||isReg()||isAdmin();
const log=x=>js("POST",`prive/${S.id}/log`,{t:Date.now(),u:me.n,x});

/* ---------- horaires & courses (identiques à index.html) ---------- */
const GAME_OFFSET=36e5,MIN=6e4,HORIZON=120*MIN,gnow=()=>Date.now()+GAME_OFFSET;
const dayMid=o=>{const b=new Date(gnow());b.setHours(0,0,0,0);b.setDate(b.getDate()+o);return b.getTime()};
const decC=(r,len)=>{const t=new Array(len).fill(null);let a=r[0],x=r[1];t[a]=x;for(let k=2;k<r.length;k++){x+=r[k];t[a+k-1]=x}return{o:a,e:a+r.length-2,t}};
const CC={};
const courses=(b,k)=>{const key=b+"|"+k;if(CC[key])return CC[key];const d=T[b]&&T[b][k];if(!d)return null;return CC[key]=d.c.map(r=>decC(r,d.s.length))};
const fmtT=ts=>new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

function courseObjs(l,k,c=6){
  const now=gnow(),o=[],cs=l.b&&!l.s?courses(l.b,k):null;
  if(cs){
    const s=rawStp(l)[k],p=(l.pt&&l.pt[k]||"").trim(),e=p?s.indexOf(p):-1;
    for(let i=-1;i<=2;i++){
      const base=dayMid(i);
      for(const x of cs){
        if(x.t[0]==null||(e>0&&x.t[e]==null))continue;
        const ts=base+x.t[0]*MIN;
        if(ts>=now-3e4)o.push({ts,times:x.t.map(m=>m==null?null:base+m*MIN)});
      }
    }
  }else if(l.cad>0){
    const q=l.cad*MIN,len=stp(l)[k].length;
    let t=Math.ceil(now/q)*q;
    for(let i=0;i<c;i++,t+=q)o.push({ts:t,times:Array.from({length:len},(_,idx)=>t+idx*2*MIN)});
  }
  return o.sort((a,b)=>a.ts-b.ts).slice(0,c);
}

function activeServiceCard(){

  const l=lb(me.l),k=me.dr||0,stops=stp(l)[k]||[],idx=Math.min(me.i||0,Math.max(0,stops.length-1));
  const dl=me.dl||0,cList=courseObjs(l,k,8);
  const chosen=cList.find(c=>c.ts===(me.depTs||0))||cList[0]||null;
  const times=chosen?chosen.times:[];
  const tri=isPt(l,k),col=E(l.c||"#2458c4"),fg=ink(l.c||"#2458c4");
  const depLbl=chosen?`Départ ${fmtT(chosen.ts)}`:"Service libre";
  const dlTxt=dl===0?"À l’heure":(dl>0?`+${dl} min`:`${dl} min`);
  const dlCol=dl>0?"#ff9b93":"#7ef0b5";

  const courseSel=cList.length>1?`<select class="sb" style="width:auto;margin:0;padding:8px 10px" onchange="A.setDep(this.value)">${cList.map(c=>`<option value="${c.ts}"${chosen&&c.ts===chosen.ts?" selected":""}>Départ ${fmtT(c.ts)}</option>`).join("")}</select>`:"";

  const rows=stops.map((st,i)=>{
    const cls=i<idx?"past":(i===idx?"cur":"");
    const isEnd=i===stops.length-1;
    const baseTs=times[i]!=null?times[i]:null;
    const realTs=baseTs!=null?baseTs+dl*MIN:null;
    const tag=i===idx?`<span class="tl-tag">Position</span>`:(isEnd?`<span class="tl-tag">Terminus</span>`:"");
    return`<div class="tl-step ${cls}${isEnd?" term":""}" data-a="setst" data-i="${i}">
      <div class="tl-rail"><span class="tl-dot"></span></div>
      <div class="tl-name">${sn(st)} ${tag}</div>
      <div class="tl-time">${realTs!=null?`<span class="led">${fmtT(realTs)}</span>${dl!==0?`<span class="adj">${dl>0?"+":""}${dl}m</span>`:""}`:"—"}</div>
    </div>`;
  }).join("");

  return`<div class="svc-wrap" style="--lc:${col};--lk:${fg}">
    <div class="svc-head">
      <div class="svc-badge${tri?" tri":""}">${E(l.n)}</div>

        <div class="svc-dir">→ ${sn(tm(l,k))}</div>
        <div class="svc-sub"><span>${depLbl}</span><span>·</span><span>Arrêt : <b>${E(stops[idx]||"—")}</b> (${idx+1}/${stops.length})</span><span>·</span><b style="color:${dl>0?"var(--late)":"var(--ok)"}">${dlTxt}</b></div>
      </div>
    </div>
    <div class="svc-bar">
      <button class="pb" data-a="nx"${idx>=stops.length-1?" disabled":""}>Arrêt suivant →</button>
      <div class="pill"><button class="dl-btn" data-a="dl" data-v="-1">−</button><span style="color:${dlCol}">${dlTxt}</span><button class="dl-btn" data-a="dl" data-v="1">+</button></div>
      ${courseSel}
      <button class="bt" data-a="flipdir">Inverser le sens</button>
      <button class="pb dg" data-a="qt">Terminer le service</button>
    </div>
    <div class="tl-card">
      <div class="tl-top"><h3>Arrêts programmés · Ligne ${E(l.n)}</h3><span style="font-size:13px;opacity:.75">Clique sur un arrêt pour y placer le véhicule</span></div>
      <div class="tl-list">${rows}</div>
    </div>
  </div>`;
}

$("#tcs").innerHTML=cs.length?cs.map(c=>`<option value="${c.ts}">Départ ${fmtT(c.ts)}</option>`).join(""):`<option value="0">Service libre</option>`}
function edl(id){if(!isReg())return tt("Réservé au créateur, aux régulateurs et aux admins.");const l=id?lb(id):{n:"",c:"#2458c4",dg:0,cad:0,st:"ok",pt:["",""],pto:[0,0],s:[[],[]]},s=rawStp(l);
md(`<h2>${id?"Modifier la ligne":"Nouvelle ligne"}</h2><label>Indice (1 à 4 caractères · « RER » = indice RER)<input id="en" maxlength="12" value="${E(l.n)}"></label>
<label>Couleur de fond<input id="ec" type="color" value="${l.c}"></label><label><input id="ed" type="checkbox"${l.dg?" checked":""}>Diagonale noire (façon N76 / 135)</label><br>
<label>Cadence (minutes, 0 = aucune)<input id="ek" type="number" min="0" value="${l.cad||0}"></label>
<label>État<select id="es"><option value="ok">En service</option><option value="int"${l.st==="int"?" selected":""}>Interrompue</option></select></label>
<label>Arrêts sens 1 (un par ligne)<textarea id="e0" rows="4">${E(s[0].join("\n"))}</textarea></label><label>Arrêts sens 2 (un par ligne)<textarea id="e1" rows="4">${E(s[1].join("\n"))}</textarea></label>
<datalist id="dl0">${s[0].map(x=>`<option value="${E(x)}">`).join("")}</datalist><datalist id="dl1">${s[1].map(x=>`<option value="${E(x)}">`).join("")}</datalist>
<label>Terminus sens 1 (arrêt existant ou texte libre)<input id="p0" list="dl0" value="${E(l.pt?.[0]||"")}"></label>
<label style="margin:-4px 0 10px"><input id="po0" type="checkbox"${l.pto?.[0]?" checked":""}>Terminus officiel (sans triangle de service partiel)</label>
<label>Terminus sens 2 (arrêt existant ou texte libre)<input id="p1" list="dl1" value="${E(l.pt?.[1]||"")}"></label>
<label style="margin:-4px 0 10px"><input id="po1" type="checkbox"${l.pto?.[1]?" checked":""}>Terminus officiel (sans triangle de service partiel)</label>
<div class="bs"><button class="pb" data-a="esv" data-id="${id}">Enregistrer</button>${id?`<button class="sb" data-a="edp" data-id="${id}">Dupliquer</button><button class="sb" data-a="eor" data-id="${id}">Ordonner un départ</button><button class="pb dg" data-a="edel" data-id="${id}">Supprimer</button>`:""}<button class="sb" data-a="mc">Annuler</button></div>`)}

function delLinesModal(){if(!isReg())return tt("Réservé au créateur, aux régulateurs et aux admins.");const list=LS();
md(`<h2>Supprimer des lignes</h2><p>Coche les lignes à supprimer de ce serveur.</p>
<div style="display:flex;gap:8px;margin-bottom:8px"><button type="button" class="sb" data-a="selall" data-v="1">Tout cocher</button><button type="button" class="sb" data-a="selall" data-v="0">Tout décocher</button></div>
<div class="del-list">${list.map(l=>`<label class="del-item"><input type="checkbox" class="dlchk" value="${E(l.id)}">${bd(l)}<b>Ligne ${E(l.n)}</b><span style="margin-left:auto;font-size:13px;opacity:.75">${E(tm(l,0))}</span></label>`).join("")||"Aucune ligne."}</div>
<div class="bs"><button class="pb dg" data-a="dellines_go">Supprimer la sélection</button><button class="sb" data-a="mc">Annuler</button></div>`)}

function exportLinesJSON(){
  const clean=Object.fromEntries(LS().map(({id,...rest})=>[id,rest]));
  return JSON.stringify({version:1,server:S.d.meta.name,exportedAt:new Date().toISOString(),lines:clean},null,2);
}

function jsonModal(){
  if(!canJson())return tt("Export/Import JSON réservé aux admins, au créateur et aux régulateurs.");
  md(`<h2>Exporter / Importer les lignes (JSON)</h2>
  <p style="margin-bottom:8px">Copie ou télécharge le JSON des lignes actuelles, ou colle/charge un fichier JSON pour importer des lignes.</p>
  <textarea id="jtxt" rows="9" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:12px">${E(exportLinesJSON())}</textarea>
  <div class="bs" style="margin-bottom:14px">
    <button class="sb" data-a="jcopy">Copier le JSON</button>
    <button class="sb" data-a="jdl">Télécharger .json</button>
    <label class="sb" style="display:inline-flex;align-items:center;cursor:pointer;margin:0">Charger un fichier .json<input type="file" accept=".json,application/json" style="display:none" onchange="A.jfile(this)"></label>
  </div>
  <div class="bs">
    <button class="pb" data-a="jimp" data-mode="merge">Importer (ajouter / fusionner)</button>
    <button class="pb dg" data-a="jimp" data-mode="replace">Importer (remplacer toutes les lignes)</button>
    <button class="sb" data-a="mc">Fermer</button>
  </div>`);
}

};

if(!await okRes(rSrv))return tt("Création refusée par la base de données (règles Firebase).");

if(WEBHOOK_URL)fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:"Régulation Bus",content:`Nouveau serveur privé : ${name.replace(/[@`]/g,"")} (${code})`,allowed_mentions:{parse:[]}})}).catch(()=>{});
enter(id)};

A.flipdir=()=>{me.dr=me.dr?0:1;me.i=0;me.depTs=0;draw(true);poll()};

A.unban=async a=>{if(!isOwn())return;await js("DELETE",`prive/${S.id}/ban/${a.u}`);log("a levé le bannissement de "+(S.d.members[a.u]?.n||a.u));poll();setTimeout(()=>draw(true),500)};
A.role=async a=>{if(!isOwn())return;const m=S.d.members?.[a.u];if(!m)return;await js("PATCH",`prive/${S.id}/members/${a.u}`,{r:m.r?"":1});log((m.r?"a retiré le rôle de régulateur à ":"a nommé régulateur ")+m.n);await poll();draw(true)};
A.addreg=async()=>{if(!isOwn())return;const u=$("#reg_sel")?.value;if(!u)return tt("Sélectionne un membre.");const m=S.d.members?.[u];if(!m)return;await js("PATCH",`prive/${S.id}/members/${u}`,{r:1});log("a nommé régulateur "+m.n);tt(`${m.n} est maintenant régulateur.`);await poll();draw(true)};
A.own=async a=>{if(!isOwn())return;if(!confirm("Transférer la propriété du serveur ?"))return;await js("PATCH",`prive/${S.id}/meta`,{owner:a.u});log("a transféré la propriété à "+S.d.members[a.u].n);tab="l";poll()};
A.sm=async()=>{if(!isReg())return;const x=$("#rx").value.trim();if(!x)return;const u=[...document.querySelectorAll(".pu:checked")].map(e=>e.value),tg=u.length?"u:"+u.join(","):$("#rt").value;
await js("POST",`prive/${S.id}/msgs`,{t:Date.now(),f:me.n,x,tg});log("message de régulation → "+tgn(tg));poll();setTimeout(()=>draw(true),500)};
A.sb=async()=>{if(!isReg())return;const x=$("#bx").value.trim();if(!x)return;await js("POST",`prive/${S.id}/banners`,{x,l:$("#bl").value});log("bannière publiée : "+x);poll();setTimeout(()=>draw(true),500)};
A.db=async a=>{if(!isReg())return;await js("DELETE",`prive/${S.id}/banners/${a.k}`);poll();setTimeout(()=>draw(true),500)};
A.dmg=async a=>{if(!isReg())return;await js("DELETE",`prive/${S.id}/msgs/${a.k}`);poll();setTimeout(()=>draw(true),500)};
A.cs=async()=>{const i=$("#ci"),x=i.value.trim();if(!x)return;i.value="";await js("POST",`prive_chat/${S.id}/${chan}`,{u:uid,n:me.n,x,t:Date.now()});chatLoad()};
A.sv=async()=>{if(!isOwn())return;const name=$("#gn").value.trim()||S.d.meta.name,pub=$("#gp").checked?1:0,color=$("#gc").value;const r1=await js("PATCH",`prive/${S.id}/meta`,{name,color,pub,ix:$("#gi").checked?1:0,pin:$("#gm").value.trim()});
const r2=await js(pub?"PUT":"DELETE","prive_pub/"+S.id,pub?{n:name,c:color}:undefined);log("paramètres modifiés");
const ok1=await okRes(r1),ok2=await okRes(r2);
if(!ok1||!ok2)tt("Enregistrement refusé par la base de données (règles Firebase).");else tt(pub?"Enregistré · serveur visible dans la liste publique.":"Enregistré.");poll();setTimeout(()=>draw(true),500)};
A.cp=()=>navigator.clipboard?.writeText(location.origin+location.pathname+"#"+S.d.meta.code).then(()=>tt("Lien copié."));
A.gx=async()=>{if(!isOwn())return;await js("PATCH","prive_codes/"+S.d.meta.code,{max:+$("#gx").value||0});tt("Limite appliquée.")};
A.rg=async()=>{if(!isOwn())return;if(!confirm("L’ancien lien cessera de fonctionner. Continuer ?"))return;const old=S.d.meta.code,c=mkCode(),mx=+$("#gx").value||0;await js("DELETE","prive_codes/"+old);await js("PUT","prive_codes/"+c,{id:S.id,max:mx,used:0});await js("PATCH",`prive/${S.id}/meta`,{code:c});log("lien d’invitation régénéré");await poll();draw(true)};
A.delsrv=async()=>{if(!isOwn())return;if(!confirm("Supprimer définitivement ce serveur ?"))return;const id=S.id,c=S.d.meta.code;await Promise.all([js("DELETE","prive/"+id),js("DELETE","prive_codes/"+c),js("DELETE","prive_pub/"+id),js("DELETE","prive_chat/"+id)]);leaveSrv("Serveur supprimé.")};

A.dellines=()=>delLinesModal();

A.dellines_go=async()=>{if(!isReg())return;const ids=[...document.querySelectorAll(".dlchk:checked")].map(c=>c.value);if(!ids.length)return tt("Coche au moins une ligne.");
const names=ids.map(id=>lb(id)?.n).filter(Boolean);
if(!confirm(`Supprimer ${ids.length} ligne(s) (${names.join(", ")}) ?`))return;
await Promise.all(ids.map(id=>js("DELETE",`prive/${S.id}/lines/${id}`)));
if(me.l&&ids.includes(me.l))me.l="";
log("lignes supprimées : "+names.join(", "));md();tt(`${ids.length} ligne(s) supprimée(s).`);await poll();draw(true)};

A.jsonio=()=>jsonModal();
A.jcopy=()=>{if(!canJson())return;navigator.clipboard?.writeText($("#jtxt").value).then(()=>tt("JSON copié dans le presse-papiers."))};
A.jdl=()=>{if(!canJson())return;const blob=new Blob([$("#jtxt").value],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`lignes-${(S.d.meta.name||"serveur").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.json`;a.click();URL.revokeObjectURL(a.href)};
A.jfile=inp=>{if(!canJson())return;const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#jtxt").value=String(r.result||"");tt("Fichier chargé.")};r.readAsText(f)};
A.jimp=async a=>{
  if(!canJson())return tt("Export/Import JSON réservé aux admins, au créateur et aux régulateurs.");
  let raw;try{raw=JSON.parse($("#jtxt").value)}catch{return tt("JSON invalide.")}
  const src=Array.isArray(raw)?raw:(raw&&typeof raw.lines==="object"?(Array.isArray(raw.lines)?raw.lines:Object.entries(raw.lines).map(([id,v])=>({id,...v}))):null);
  if(!src||!src.length)return tt("Aucune ligne valide trouvée dans le JSON.");
  if(a.mode==="replace"&&!confirm("Remplacer toutes les lignes existantes du serveur par ce JSON ?"))return;
  const out={},baseOrd=a.mode==="replace"?0:LS().length;
  src.forEach((item,idx)=>{
    if(!item||!item.n)return;
    const id=(item.id&&/^[a-zA-Z0-9_-]+$/.test(item.id)&&a.mode==="replace")?item.id:("l"+Date.now().toString(36)+idx.toString(36));
    const entry={
      n:String(item.n).trim().toUpperCase().slice(0,12),
      c:/^#[0-9a-fA-F]{6}$/.test(item.c||"")?item.c:"#2458c4",
      dg:item.dg?1:0,
      cad:+item.cad||0,
      st:item.st==="int"?"int":"ok",
      pt:Array.isArray(item.pt)?[String(item.pt[0]||"").trim(),String(item.pt[1]||"").trim()]:["",""],
      pto:Array.isArray(item.pto)?[item.pto[0]?1:0,item.pto[1]?1:0]:[0,0],
      o:typeof item.o==="number"?item.o:(baseOrd+idx)
    };
    if(item.b&&!item.s)entry.b=String(item.b);
    else if(Array.isArray(item.s))entry.s=[Array.isArray(item.s[0])?item.s[0].map(String):[],Array.isArray(item.s[1])?item.s[1].map(String):[]];
    else return;
    out[id]=entry;
  });
  const count=Object.keys(out).length;
  if(!count)return tt("Aucune ligne exploitable dans le JSON.");
  const res=await js(a.mode==="replace"?"PUT":"PATCH",`prive/${S.id}/lines`,out);
  if(!await okRes(res))return tt("Import refusé par la base de données.");
  if(a.mode==="replace"&&me.l&&!out[me.l])me.l="";
  log(`import JSON (${a.mode==="replace"?"remplacement":"fusion"}) : ${count} ligne(s)`);
  md();tt(`${count} ligne(s) importée(s).`);await poll();draw(true);
};

A.esv=async a=>{if(!isReg())return;const n=$("#en").value.trim().toUpperCase();if(!n||n.replace(/RER/g,"R").length>4)return tt("Indice : 1 à 4 caractères.");
const old=a.id?lb(a.id):null,ln=k=>$("#e"+k).value.split("\n").map(s=>s.trim()).filter(Boolean),s=[ln(0),ln(1)],same=old&&!old.s&&JSON.stringify(s)===JSON.stringify(rawStp(old)),
l={n,c:$("#ec").value,dg:$("#ed").checked?1:0,cad:+$("#ek").value||0,st:$("#es").value,pt:[$("#p0").value.trim(),$("#p1").value.trim()],pto:[$("#po0").checked?1:0,$("#po1").checked?1:0],o:old?.o??LS().length};
if(old?.dep)l.dep=old.dep;if(same)l.b=old.b;else if(old?.b&&!old.s&&!s[0].length&&!s[1].length)l.b=old.b;else l.s=s;
if(!l.b&&!l.s[0].length&&!l.s[1].length)return tt("Ajoute au moins un arrêt.");
await js("PUT",`prive/${S.id}/lines/${a.id||"l"+Date.now().toString(36)}`,l);log((old?"ligne modifiée : ":"ligne créée : ")+n+(old&&old.st!==l.st?(l.st==="int"?" (interrompue)":" (réactivée)"):""));md();poll()};
A.edp=async a=>{if(!isReg())return;const l={...lb(a.id)};delete l.id;l.n=l.n.slice(0,3)+"2";l.o=LS().length;const id="l"+Date.now().toString(36);await js("PUT",`prive/${S.id}/lines/${id}`,l);log("ligne dupliquée : "+l.n);await poll();edl(id)};
A.eor=async a=>{if(!isReg())return;const l=lb(a.id);await js("PATCH",`prive/${S.id}/lines/${a.id}`,{dep:Date.now()});await js("POST",`prive/${S.id}/msgs`,{t:Date.now(),f:me.n,x:"Départ ordonné — ligne "+l.n,tg:"l:"+a.id});log("départ ordonné ligne "+l.n);md();poll()};
A.edel=async a=>{if(!isReg())return;if(!confirm("Supprimer cette ligne ?"))return;const n=lb(a.id)?.n||a.id;log("ligne supprimée : "+n);await js("DELETE",`prive/${S.id}/lines/${a.id}`);if(me.l===a.id)me.l="";md();poll()};
